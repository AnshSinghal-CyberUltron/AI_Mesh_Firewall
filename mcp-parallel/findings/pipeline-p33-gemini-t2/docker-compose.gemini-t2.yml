# Production overlay: Gemini Developer API for Tier-2 (input scan + output guard).
# Does not change IMAGE_TAG for nginx/workers/broker. Apply LAST in compose -f list.
services:
  gateway:
    image: asia-south1-docker.pkg.dev/aisecshield-prod/mesh-firewall-images/ai-mesh-gateway:v20260911-gemini-t2
    environment:
      TIER2_PROVIDER: ${TIER2_PROVIDER:-gemini}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      VERTEX_TIER2_MODEL: ${VERTEX_TIER2_MODEL:-gemini-3.5-flash-lite}
  control:
    image: asia-south1-docker.pkg.dev/aisecshield-prod/mesh-firewall-images/ai-mesh-control:v20260911-gemini-t2
    environment:
      TIER2_PROVIDER: ${TIER2_PROVIDER:-gemini}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      VERTEX_TIER2_MODEL: ${VERTEX_TIER2_MODEL:-gemini-3.5-flash-lite}
