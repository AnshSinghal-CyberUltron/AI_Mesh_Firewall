# Reusable: lint, type-check and test one Python package.
#
# Call from any repo:
#   jobs:
#     api:
#       uses: AnshSinghal-CyberUltron/AI_Mesh_Firewall/.github/workflows/reusable-python-ci.yml@main
#       with:
#         working-directory: services/api
#         install-command: pip install -e ".[dev]"
#         test-command: pytest -q --junitxml=junit.xml
#
# Every command runs inside a fresh venv at $VENV (on PATH), from `working-directory`.
# Leave a command empty to skip that step. Set `known-failures-file` (relative to the repo
# root) to ratchet against legacy failures instead of requiring a fully green suite; the test
# command must then write pytest junit XML to `junit-path`.
name: reusable-python-ci

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        required: true
      python-version:
        type: string
        default: "3.12"
      install-command:
        type: string
        required: true
      lint-command:
        type: string
        default: ""
      typecheck-command:
        type: string
        default: ""
      test-command:
        type: string
        required: true
      junit-path:
        type: string
        default: junit.xml
      known-failures-file:
        type: string
        default: ""
      timeout-minutes:
        type: number
        default: 45
      report-name:
        description: Artifact name for the junit report; must be unique within the calling run.
        type: string
        default: python-tests

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Create venv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "VENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      # Commands come from the calling workflow (trusted), and are passed through env rather
      # than templated into the script text, so no input can inject shell syntax.
      - name: Install
        env: { CMD: "${{ inputs.install-command }}" }
        run: eval "$CMD"
      - name: Lint
        if: inputs.lint-command != ''
        env: { CMD: "${{ inputs.lint-command }}" }
        run: eval "$CMD"
      - name: Type-check
        if: inputs.typecheck-command != ''
        env: { CMD: "${{ inputs.typecheck-command }}" }
        run: eval "$CMD"
      - name: Test
        id: test
        # With a known-failures baseline the ratchet below decides pass/fail, not pytest's exit.
        continue-on-error: ${{ inputs.known-failures-file != '' }}
        env: { CMD: "${{ inputs.test-command }}" }
        run: eval "$CMD"
      - name: Known-failure ratchet
        if: inputs.known-failures-file != ''
        working-directory: .
        env:
          JUNIT: ${{ inputs.working-directory }}/${{ inputs.junit-path }}
          BASELINE: ${{ inputs.known-failures-file }}
        run: python scripts/ci/known_failures.py --junit "$JUNIT" --baseline "$BASELINE"
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.report-name }}
          path: ${{ inputs.working-directory }}/${{ inputs.junit-path }}
          if-no-files-found: ignore
          retention-days: 14
