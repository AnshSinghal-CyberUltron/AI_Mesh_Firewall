name: gateway-v2

# A new push to a PR cancels the run it supersedes, as in ci.yml and security.yml.
concurrency:
  group: gateway-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Runners and timeouts (docs/ci/README.md, "Runners and timeouts"):
# - Jobs that mostly run tests read `runs-on` from the repository variable AMF_RUNNER_HEAVY and
#   fall back to the free standard runner when it is unset. image-digest stays on the standard
#   runner: its LGW03-1 step runs the image with --cpus 2 and --cpus 4.
# - Every job has a `timeout-minutes` several times its measured duration, so a hang fails the
#   job instead of running to GitHub's 360-minute default. pytest-timeout (gateway_v2
#   pyproject) fails a single hung test first and names it.

on:
  pull_request:
  push:
    branches:
      - revamp

# Least privilege: every job only checks out and reads the repository. upload-artifact
# authenticates with the runner's ACTIONS_RUNTIME_TOKEN, not GITHUB_TOKEN, so no job needs more.
permissions:
  contents: read

jobs:
  structural-gates:
    runs-on: ubuntu-latest
    # Install plus the lint gates take about 1 min; the full pytest runs in the shards below.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gateway_v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install v2 dev deps
        run: |
          python -m venv .venv
          # `serve` brings httpx + uvicorn (the provider, MCP broker and serve entrypoint import
          # them, so `mypy --strict` needs them); `conformance` brings pytest-asyncio + openai, which
          # the httpx-backed tests need once httpx is installed (they importorskip httpx only).
          .venv/bin/pip install -q -e ".[dev,serve,conformance]"
      # The reference for `gateway-v2 pytest`: the test ids of the plain, unsharded command.
      - name: Unsharded pytest collection (reference for the shards)
        run: |
          .venv/bin/python -m pytest --collect-only -q > "$RUNNER_TEMP/gw2-collection.txt"
          tail -n 1 "$RUNNER_TEMP/gw2-collection.txt"
      - name: Upload the unsharded collection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gw2-collection
          path: ${{ runner.temp }}/gw2-collection.txt
          retention-days: 7
          overwrite: true
      - name: Size + HTTP AST + mutable-state + capacity + tenant-scale gates
        run: |
          for tree in gateway_v2 state_control; do
            .venv/bin/python -m lint.check_sizes "$tree"
            .venv/bin/python -m lint.check_http_outside_edge_resolve "$tree"
            .venv/bin/python -m lint.check_no_module_mutable "$tree"
            .venv/bin/python -m lint.check_capacity_literals "$tree"
            .venv/bin/python -m lint.check_frozen_dataclasses "$tree"
            .venv/bin/python -m lint.check_dispatch_provenance "$tree"
          done
          # R2-02 / 2.1-1: the data plane only. The control plane's repair path is
          # O(records) by design and runs off the serving loop.
          .venv/bin/python -m lint.check_tenant_scale gateway_v2
      - name: import-linter
        run: .venv/bin/lint-imports
      - name: ruff
        run: .venv/bin/ruff check gateway_v2 state_control lint tests
      - name: mypy --strict
        run: .venv/bin/mypy --strict
      - name: GW14b console inventory matches this tree
        run: .venv/bin/python -m lint.check_console_inventory

  # The full gateway_v2 pytest, split by whole test file across the matrix below. Every shard
  # collects the whole suite and runs only its own files (scripts/ci/amf_pytest_shards.py); the
  # `gateway-v2 pytest` job then proves the shards ran every collected test exactly once. The
  # shard jobs' names change with the shard count, so require `gateway-v2 pytest`, not them.
  pytest-shard:
    name: gateway-v2 pytest shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ${{ vars.AMF_RUNNER_HEAVY || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      # Run every shard to the end, so one run lists every failing test.
      fail-fast: false
      matrix:
        # The shard count is the length of this list (strategy.job-total); the plugin gets
        # strategy.job-index, so the labels are display-only.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults:
      run:
        working-directory: gateway_v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install v2 dev deps
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -e ".[dev,serve,conformance]"
      # `--option=value` only, and the config pinned: pytest picks its rootdir and config file
      # before -p plugins load, so `--shard-weights PATH` made it read the repository root's
      # pyproject.toml (5,257 tests, no --ignore list, no timeout). The plugin refuses that form.
      - name: v2 pytest (this shard's test files)
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts/ci
          SHARD_INDEX: ${{ strategy.job-index }}
          SHARD_COUNT: ${{ strategy.job-total }}
        run: |
          .venv/bin/python -m pytest -q --config-file=pyproject.toml -p amf_pytest_shards \
            --shard-index="$SHARD_INDEX" --shard-count="$SHARD_COUNT" \
            --shard-weights=../.github/ci/gateway-v2-test-durations.json \
            --shard-report="$RUNNER_TEMP/gw2-shard/shard-$SHARD_INDEX.json"
      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gw2-shard-${{ strategy.job-index }}
          path: ${{ runner.temp }}/gw2-shard/
          if-no-files-found: ignore
          retention-days: 7
          # "Re-run failed jobs" uploads the same name again; the aggregate then reads the newest.
          overwrite: true

  pytest:
    # The check to require. Green only when every shard passed and the shards together selected
    # every test of the unsharded collection (from structural-gates) exactly once. `always()`,
    # not `!cancelled()`: GitHub counts a SKIPPED required check as passed, so this job must run,
    # and fail, when a shard failed or the run was cancelled.
    name: gateway-v2 pytest
    needs: [pytest-shard, structural-gates]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Download shard reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gw2-shard-*
          path: ${{ runner.temp }}/gw2-shards
          merge-multiple: true
      - name: Download the unsharded collection
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gw2-collection
          path: ${{ runner.temp }}
      - name: Shards ran the unsharded collection exactly once, and every shard passed
        run: |
          python scripts/ci/amf_pytest_shards.py verify "$RUNNER_TEMP/gw2-shards" \
            --expect-collection "$RUNNER_TEMP/gw2-collection.txt"
      - name: Every shard job succeeded
        if: always()
        env:
          RESULT: ${{ needs.pytest-shard.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error title=gateway-v2 pytest::the shard jobs ended '$RESULT'; open the failing shard's log"
            exit 1
          fi
      - name: Per-file durations (to refresh .github/ci/gateway-v2-test-durations.json)
        run: |
          python scripts/ci/amf_pytest_shards.py weights "$RUNNER_TEMP/gw2-shards" > "$RUNNER_TEMP/gateway-v2-test-durations.json"
          echo "::group::gateway-v2-test-durations.json"
          cat "$RUNNER_TEMP/gateway-v2-test-durations.json"
          echo "::endgroup::"
      - name: Upload durations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gateway-v2-test-durations
          path: ${{ runner.temp }}/gateway-v2-test-durations.json
          retention-days: 14
          overwrite: true

  secret-headers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Fail closed on any tracked OpenSSH/PEM key-shaped file
        run: python gateway_v2/lint/check_secret_headers.py --repo . --fail-allowlist
      - name: LGW00-2 throwaway extensionless header (not committed)
        working-directory: gateway_v2
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, ".")
          from lint.check_secret_headers import scan_paths
          blob = Path("/tmp/lgw00-2-extensionless")
          blob.write_text(
              "-----BEGIN OPENSSH PRIVATE KEY-----\n"
              "LGW00-2-CI-FIXTURE-NOT-A-REAL-KEY\n"
              "-----END OPENSSH PRIVATE KEY-----\n",
              encoding="utf-8",
          )
          hits = scan_paths([blob], allowlist=set())
          if not hits:
              raise SystemExit("LGW00-2 FAIL: scanner accepted an OpenSSH header")
          print("lgw00_2_rejected", blob.name)
          PY
      - name: GW00 Req 1.1 throwaway bare PKCS#8 header (not committed)
        working-directory: gateway_v2
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, ".")
          from lint.check_secret_headers import scan_paths
          # Assemble the bare PKCS#8 header from fragments so this workflow file
          # never contains the literal header string (mirrors how the scanner
          # assembles its needle and how the OpenSSH check assembles above).
          begin = "BEGIN " + "PRIVATE KEY"
          header = "-----" + begin + "-----\n"
          footer = "-----END " + "PRIVATE KEY-----\n"
          blob = Path("/tmp/lgw00-pkcs8")
          blob.write_text(
              header + "GW00-REQ-1-1-CI-FIXTURE-NOT-A-REAL-KEY\n" + footer,
              encoding="utf-8",
          )
          hits = scan_paths([blob], allowlist=set())
          if not hits:
              raise SystemExit("GW00 FAIL: scanner accepted a bare PKCS#8 header")
          print("gw00_pkcs8_rejected", blob.name)
          PY

  image-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_DATE_EPOCH: "1704067200"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container
          driver-opts: |
            image=moby/buildkit:v0.21.1@sha256:87afb62ed6a762bb65b85d53819f3b341fb74a36d1fc0a1153a64f367637bfda
      - name: Build v2 image without attestations
        run: |
          docker buildx build --provenance=false --sbom=false --load \
            --build-arg SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH}" \
            -f gateway_v2/Dockerfile \
            -t ai-mesh-gateway-v2:gw00 .
          docker image inspect ai-mesh-gateway-v2:gw00 --format '{{.Id}}' | tee gw00-image-id.txt
          docker image inspect ai-mesh-gateway-v2:gw00 --format '{{json .RootFS.Layers}}' | tee gw00-rootfs-layers.json
          docker run --rm ai-mesh-gateway-v2:gw00
      - name: LGW03-1 GitHub-hosted --cpus 2 vs 4
        run: |
          python3 - <<'PY'
          import json
          import subprocess

          def snap(cpus: str) -> dict:
              out = subprocess.check_output(
                  [
                      "docker", "run", "--rm", f"--cpus={cpus}",
                      "ai-mesh-gateway-v2:gw00",
                      "python", "-m", "gateway_v2.runtime",
                  ],
                  text=True,
              )
              return json.loads(out)

          a = snap("2")
          b = snap("4")
          keys = ("cpu_quota", "workers", "queue_depth", "pools")
          print("cpus2", json.dumps({k: a[k] for k in keys}, sort_keys=True))
          print("cpus4", json.dumps({k: b[k] for k in keys}, sort_keys=True))
          if a["workers"] == b["workers"]:
              raise SystemExit("LGW03-1 GHA FAIL: workers identical at --cpus 2 and 4")
          if a["queue_depth"] == b["queue_depth"]:
              raise SystemExit("LGW03-1 GHA FAIL: queue_depth identical at --cpus 2 and 4")
          if a["pools"]["scanner"] == b["pools"]["scanner"]:
              raise SystemExit("LGW03-1 GHA FAIL: scanner pool identical at --cpus 2 and 4")
          print("lgw03_1_gha_ok")
          PY
      - name: Upload image id
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gw00-image-id
          path: |
            gw00-image-id.txt
            gw00-rootfs-layers.json

  openai-conformance:
    runs-on: ${{ vars.AMF_RUNNER_HEAVY || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/gateway:${{ github.workspace }}/shared:${{ github.workspace }}/gateway_v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Install v1 + suite deps
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -e ./shared
          .venv/bin/python - <<'PY'
          import subprocess
          import sys
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("gateway/pyproject.toml").read_text())
          deps = list(data["project"]["dependencies"])
          deps += data["project"]["optional-dependencies"]["dev"]
          subprocess.check_call([sys.executable, "-m", "pip", "install", *deps])
          PY
      - name: LGW01-1/2/4/5 Python ASGI + loopback TCP (twice)
        working-directory: gateway_v2
        run: |
          set +e
          ../.venv/bin/python -m pytest tests/openai_conformance \
            --ignore=tests/openai_conformance/node \
            --ignore=tests/openai_conformance/stub_server.py \
            -q --tb=line --junitxml=/tmp/gw01-a.xml
          a=$?
          ../.venv/bin/python -m pytest tests/openai_conformance \
            --ignore=tests/openai_conformance/node \
            --ignore=tests/openai_conformance/stub_server.py \
            -q --tb=line --junitxml=/tmp/gw01-b.xml
          b=$?
          set -e
          # pytest 0=all pass, 1=recorded failures (ledger). >=2 is harness death.
          if [ "$a" -ge 2 ] || [ "$b" -ge 2 ]; then
            echo "pytest crashed a=$a b=$b"
            exit 1
          fi
          test -s /tmp/gw01-a.xml && test -s /tmp/gw01-b.xml
          ../.venv/bin/python -m lint.compare_junit /tmp/gw01-a.xml /tmp/gw01-b.xml
          ../.venv/bin/python - <<'PY'
          import xml.etree.ElementTree as ET
          n = sum(1 for _ in ET.parse("/tmp/gw01-a.xml").iter("testcase"))
          if n < 70:
              raise SystemExit(f"LGW01-1 FAIL: only {n} cases collected")
          print("lgw01_1_collected", n)
          PY
      - name: LGW01-3 Node SDK vs stub TCP
        working-directory: gateway_v2
        run: |
          export AMF_STUB_URL_FILE=/tmp/gw01-stub-url.txt
          ../.venv/bin/python tests/openai_conformance/stub_server.py &
          stub_pid=$!
          for _ in $(seq 1 50); do
            [ -s /tmp/gw01-stub-url.txt ] && break
            sleep 0.2
          done
          test -s /tmp/gw01-stub-url.txt
          AMF_CONFORMANCE_BASE_URL="$(tr -d '[:space:]' < /tmp/gw01-stub-url.txt)"
          export AMF_CONFORMANCE_BASE_URL
          npm --prefix tests/openai_conformance/node ci
          node tests/openai_conformance/node/openai_matrix.mjs
          kill "$stub_pid" || true

  parity-harness:
    runs-on: ${{ vars.AMF_RUNNER_HEAVY || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/gateway:${{ github.workspace }}/shared:${{ github.workspace }}/gateway_v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install v2 + v1 scanner deps
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -e ./shared -e "./gateway_v2[dev]"
          .venv/bin/python - <<'PY'
          import subprocess
          import sys
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("gateway/pyproject.toml").read_text())
          deps = list(data["project"]["dependencies"])
          deps += data["project"]["optional-dependencies"]["dev"]
          subprocess.check_call([sys.executable, "-m", "pip", "install", *deps])
          PY
      - name: LGW02 C2 generate + gates
        working-directory: gateway_v2
        run: |
          ../.venv/bin/python -m gateway_v2.contracts.parity.generate 50000 /tmp/gw02-c2-coverage.json
          ../.venv/bin/python -m pytest tests/parity -q --tb=short --override-ini="addopts="
      - name: Upload C2 coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gw02-c2-coverage
          path: /tmp/gw02-c2-coverage.json
