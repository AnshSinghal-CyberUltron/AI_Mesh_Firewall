name: gateway-v2

on:
  pull_request:
  push:
    branches:
      - revamp

jobs:
  structural-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install v2 dev deps
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -e ".[dev]"
      - name: Size + HTTP AST + mutable-state gates
        run: |
          .venv/bin/python -m lint.check_sizes gateway_v2
          .venv/bin/python -m lint.check_http_outside_edge_resolve gateway_v2
          .venv/bin/python -m lint.check_no_module_mutable gateway_v2
      - name: import-linter
        run: .venv/bin/lint-imports
      - name: ruff
        run: .venv/bin/ruff check gateway_v2 lint tests
      - name: mypy --strict
        run: .venv/bin/mypy --strict
      - name: v2 pytest (placeholder + negative fixtures)
        run: .venv/bin/python -m pytest -q

  secret-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail closed on any tracked OpenSSH/PEM key-shaped file
        run: python gateway_v2/lint/check_secret_headers.py --repo . --fail-allowlist
      - name: LGW00-2 throwaway extensionless header (not committed)
        working-directory: gateway_v2
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, ".")
          from lint.check_secret_headers import scan_paths
          blob = Path("/tmp/lgw00-2-extensionless")
          blob.write_text(
              "-----BEGIN OPENSSH PRIVATE KEY-----\n"
              "LGW00-2-CI-FIXTURE-NOT-A-REAL-KEY\n"
              "-----END OPENSSH PRIVATE KEY-----\n",
              encoding="utf-8",
          )
          hits = scan_paths([blob], allowlist=set())
          if not hits:
              raise SystemExit("LGW00-2 FAIL: scanner accepted an OpenSSH header")
          print("lgw00_2_rejected", blob.name)
          PY

  image-digest:
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: "1704067200"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: |
            image=moby/buildkit:v0.21.1@sha256:87afb62ed6a762bb65b85d53819f3b341fb74a36d1fc0a1153a64f367637bfda
      - name: Build v2 image without attestations
        run: |
          docker buildx build --provenance=false --sbom=false --load \
            --build-arg SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH}" \
            -f gateway_v2/Dockerfile \
            -t ai-mesh-gateway-v2:gw00 .
          docker image inspect ai-mesh-gateway-v2:gw00 --format '{{.Id}}' | tee gw00-image-id.txt
          docker image inspect ai-mesh-gateway-v2:gw00 --format '{{json .RootFS.Layers}}' | tee gw00-rootfs-layers.json
          docker run --rm ai-mesh-gateway-v2:gw00
      - name: Upload image id
        uses: actions/upload-artifact@v4
        with:
          name: gw00-image-id
          path: |
            gw00-image-id.txt
            gw00-rootfs-layers.json

  openai-conformance:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/gateway:${{ github.workspace }}/shared:${{ github.workspace }}/gateway_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install v1 + suite deps
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -e ./shared
          .venv/bin/python - <<'PY'
          import subprocess
          import sys
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("gateway/pyproject.toml").read_text())
          deps = list(data["project"]["dependencies"])
          deps += data["project"]["optional-dependencies"]["dev"]
          subprocess.check_call([sys.executable, "-m", "pip", "install", *deps])
          PY
      - name: LGW01-1/2/4/5 Python ASGI + loopback TCP (twice)
        working-directory: gateway_v2
        run: |
          set +e
          ../.venv/bin/python -m pytest tests/openai_conformance \
            --ignore=tests/openai_conformance/node \
            --ignore=tests/openai_conformance/stub_server.py \
            -q --tb=line --junitxml=/tmp/gw01-a.xml
          a=$?
          ../.venv/bin/python -m pytest tests/openai_conformance \
            --ignore=tests/openai_conformance/node \
            --ignore=tests/openai_conformance/stub_server.py \
            -q --tb=line --junitxml=/tmp/gw01-b.xml
          b=$?
          set -e
          # pytest 0=all pass, 1=recorded failures (ledger). >=2 is harness death.
          if [ "$a" -ge 2 ] || [ "$b" -ge 2 ]; then
            echo "pytest crashed a=$a b=$b"
            exit 1
          fi
          test -s /tmp/gw01-a.xml && test -s /tmp/gw01-b.xml
          ../.venv/bin/python -m lint.compare_junit /tmp/gw01-a.xml /tmp/gw01-b.xml
          ../.venv/bin/python - <<'PY'
          import xml.etree.ElementTree as ET
          n = sum(1 for _ in ET.parse("/tmp/gw01-a.xml").iter("testcase"))
          if n < 70:
              raise SystemExit(f"LGW01-1 FAIL: only {n} cases collected")
          print("lgw01_1_collected", n)
          PY
      - name: LGW01-3 Node SDK vs stub TCP
        working-directory: gateway_v2
        run: |
          export AMF_STUB_URL_FILE=/tmp/gw01-stub-url.txt
          ../.venv/bin/python tests/openai_conformance/stub_server.py &
          stub_pid=$!
          for i in $(seq 1 50); do
            [ -s /tmp/gw01-stub-url.txt ] && break
            sleep 0.2
          done
          test -s /tmp/gw01-stub-url.txt
          export AMF_CONFORMANCE_BASE_URL="$(tr -d '[:space:]' < /tmp/gw01-stub-url.txt)"
          npm --prefix tests/openai_conformance/node ci
          node tests/openai_conformance/node/openai_matrix.mjs
          kill "$stub_pid" || true

  parity-harness:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/gateway:${{ github.workspace }}/shared:${{ github.workspace }}/gateway_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install v2 + v1 scanner deps
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -e ./shared -e "./gateway_v2[dev]"
          .venv/bin/python - <<'PY'
          import subprocess
          import sys
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("gateway/pyproject.toml").read_text())
          deps = list(data["project"]["dependencies"])
          deps += data["project"]["optional-dependencies"]["dev"]
          subprocess.check_call([sys.executable, "-m", "pip", "install", *deps])
          PY
      - name: LGW02 C2 generate + gates
        working-directory: gateway_v2
        run: |
          ../.venv/bin/python -m gateway_v2.contracts.parity.generate 50000 /tmp/gw02-c2-coverage.json
          ../.venv/bin/python -m pytest tests/parity -q --tb=short --override-ini="addopts="
      - name: Upload C2 coverage
        uses: actions/upload-artifact@v4
        with:
          name: gw02-c2-coverage
          path: /tmp/gw02-c2-coverage.json
