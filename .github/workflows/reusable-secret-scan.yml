# Reusable: secret scanning with two independent engines (free, no account needed).
#
#   gitleaks    pattern + entropy rules, config in .gitleaks.toml (falls back to defaults)
#   TruffleHog  700+ detectors, reports only credentials it VERIFIED live against the provider
#
# Scope is the commits under review: on pull_request the PR's own commits, on push the pushed
# range, and the full history on schedule/workflow_dispatch (or when `full-history: true`).
# Scanning the range rather than the tree means a historic fixture never blocks a new PR,
# while any newly committed secret does. Merge commits are scanned too (gitleaks
# --remerge-diff). Neither report artifact contains a secret value. See docs/ci/SECURITY.md.
#
#   jobs:
#     secrets:
#       uses: AnshSinghal-CyberUltron/AI_Mesh_Firewall/.github/workflows/reusable-secret-scan.yml@main
name: reusable-secret-scan

on:
  workflow_call:
    inputs:
      full-history:
        type: boolean
        default: false
      gitleaks-image:
        type: string
        default: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
      trufflehog-image:
        type: string
        default: trufflesecurity/trufflehog:3.99.8@sha256:674b2f187620a19df77f44cf9a7d77efcc581a5662accef2f2739cbb46ba4a3a

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve scan range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          FULL: ${{ inputs.full-history }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          zero=0000000000000000000000000000000000000000
          if [ "$FULL" = "true" ] || [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "pull_request" ] || [ "$EVENT" = "pull_request_target" ]; then
            base=$(git merge-base "$PR_BASE" "$PR_HEAD")
            { echo "mode=range"; echo "base=$base"; echo "head=$PR_HEAD"; } >> "$GITHUB_OUTPUT"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$zero" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            { echo "mode=range"; echo "base=$PUSH_BEFORE"; echo "head=$PUSH_AFTER"; } >> "$GITHUB_OUTPUT"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi
      - name: gitleaks
        env:
          MODE: ${{ steps.range.outputs.mode }}
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
          IMAGE: ${{ inputs.gitleaks-image }}
        run: |
          config=()
          if [ -f .gitleaks.toml ]; then config+=(--config /repo/.gitleaks.toml); fi
          if [ -f .gitleaksignore ]; then config+=(--gitleaks-ignore-path /repo/.gitleaksignore); fi
          # `git log -p` shows no diff for a merge commit, so a secret added while resolving a
          # merge would pass. --remerge-diff diffs each merge against git's own automatic merge
          # of its parents, which shows exactly what the merge commit itself introduced.
          if [ "$MODE" = "range" ]; then
            log_opts=(--log-opts "--remerge-diff $BASE..$HEAD")
          else
            log_opts=(--log-opts "--full-history --all --remerge-diff")
          fi
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/repo" -w /repo "$IMAGE" git /repo "${config[@]}" "${log_opts[@]}" \
            --redact --no-banner --exit-code 1 \
            --report-format sarif --report-path /repo/gitleaks.sarif
      - name: TruffleHog (verified secrets only)
        if: always()
        env:
          MODE: ${{ steps.range.outputs.mode }}
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
          IMAGE: ${{ inputs.trufflehog-image }}
        run: |
          args=(git file:///repo --results=verified --no-update --json)
          # A change range blocks on any live (verified) secret it adds, and on a scan that
          # errored (otherwise an aborted scan would report "0 found" and pass). The full-history
          # sweep reports instead: history cannot be fixed by the run that finds it, and a known,
          # owner-acknowledged credential would otherwise turn every weekly run red.
          # TruffleHog cannot see what a merge commit adds; gitleaks above covers merges.
          if [ "$MODE" = "range" ]; then
            args+=(--fail --fail-on-scan-errors --since-commit "$BASE" --branch "$HEAD")
          fi
          # TruffleHog's JSON carries each secret's value (Raw, RawV2, SecretParts, ExtraData)
          # and has no redact flag. Its raw output goes to the runner's temp dir, never the
          # workspace, and only where/what (never the value) reaches the uploaded artifact.
          raw="$RUNNER_TEMP/trufflehog.raw.jsonl"
          rc=0
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/repo" "$IMAGE" "${args[@]}" > "$raw" || rc=$?
          jq -R -c 'fromjson? | select(type == "object") | {
              DetectorName, Verified,
              file: .SourceMetadata.Data.Git.file,
              commit: .SourceMetadata.Data.Git.commit,
              line: .SourceMetadata.Data.Git.line
            }' "$raw" > trufflehog.jsonl
          rm -f "$raw"
          found=$(wc -l < trufflehog.jsonl)
          level=error; [ "$MODE" = "range" ] || level=warning
          # One annotation per finding. File names are repo content, so escape them as workflow
          # command properties (a newline or "::" in a name must not start a new command).
          jq -r --arg l "$level" '
            def data: tostring | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
            def prop: data | gsub(":"; "%3A") | gsub(","; "%2C");
            "::\($l) file=\(.file // "" | prop),line=\(.line // 1 | prop),title=Verified \(.DetectorName // "unknown" | prop) credential::"
            + ("TruffleHog verified a live \(.DetectorName // "unknown") credential in commit \((.commit // "")[0:12]); rotate it (docs/ci/SECURITY.md)" | data)
          ' trufflehog.jsonl
          echo "TruffleHog ($MODE): ${found} verified secret(s) in scope." | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secret-scan
          path: |
            gitleaks.sarif
            trufflehog.jsonl
          if-no-files-found: ignore
          retention-days: 30
