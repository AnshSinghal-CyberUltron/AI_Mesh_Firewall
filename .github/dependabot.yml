# Dependabot (free): weekly update PRs against `develop`, grouped so routine minor/patch bumps
# arrive as one PR per ecosystem. Security updates are raised immediately regardless of schedule
# once "Dependabot security updates" is enabled in the repo settings.
version: 2
updates:
  # Every `uses:` is pinned to a commit SHA with its release in a comment
  # (`owner/repo@<sha> # vX.Y.Z`); scripts/ci/workflow_guard.py fails CI otherwise. Dependabot
  # matches the SHA to its release tag, moves it to the newer release's commit and rewrites the
  # version comment. `directory: /` covers .github/workflows. The `ci(deps):` title prefix passes
  # the Conventional Commits check in pr-policy.yml.
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: ci, include: scope }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: pip
    directories: [/control, /gateway, /gateway_v2, /shared]
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/control, /gateway, /gateway_v2, /workers, /deploy, /services/mcp-broker]
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
