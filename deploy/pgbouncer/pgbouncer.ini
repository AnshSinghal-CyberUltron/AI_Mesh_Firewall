;; PgBouncer — transaction pooling in front of Postgres.
;; Used by the pgbouncer service (edoburu/pgbouncer reads env; this file is the
;; documented contract + fallback for operators who bind-mount a custom config).
;;
;; Apps and migrations connect to pgbouncer:6432 only (never dial postgres:5432
;; from application containers). Django uses DISABLE_SERVER_SIDE_CURSORS on :6432.

[databases]
; Overridden at runtime via DATABASE_URL / DB_* env on the container.
ai_mesh_firewall = host=postgres port=5432 dbname=ai_mesh_firewall

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
; Client fan-in (Django/Celery can open many short-lived conns).
max_client_conn = 1000
; Server-side pool into Postgres — keep well under POSTGRES_MAX_CONNECTIONS=400.
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
max_db_connections = 80
server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits,options
admin_users = ai_mesh_firewall
stats_users = ai_mesh_firewall
logfile = /dev/stdout
pidfile = /var/run/pgbouncer/pgbouncer.pid
