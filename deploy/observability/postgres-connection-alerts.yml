# Prometheus alert rules — Postgres connection budget.
# Load alongside prometheus-scrape.example.yml (rule_files).
#
# Requires postgres_exporter scraping pg_stat_database / pg_settings
# (job ai-mesh-postgres-exporter below in the scrape example).

groups:
  - name: ai-mesh-postgres-connections
    rules:
      - alert: PostgresConnectionsHigh
        expr: |
          (
            sum(pg_stat_activity_count{datname!~"template.*|postgres"})
            /
            max(pg_settings_max_connections)
          ) > 0.80
        for: 5m
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: "Postgres connection utilization >80% for 5m"
          description: >-
            numbackends / max_connections exceeded 80% for 5 minutes.
            Investigate dashboard SOC fan-out, control worker count, and
            PgBouncer max_db_connections before the pool hard-fails
            (FATAL: too many clients already).
