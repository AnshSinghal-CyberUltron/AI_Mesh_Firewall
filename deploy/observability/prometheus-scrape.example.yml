# Example Prometheus scrape config for AI Mesh Firewall gateway + Postgres.
# Set METRICS_SCRAPER_KEY on gateway and use the same value below.
# Alert rules: deploy/observability/postgres-connection-alerts.yml

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - postgres-connection-alerts.yml

scrape_configs:
  - job_name: ai-mesh-gateway
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["35.154.124.71:8300"]  # i-07a9d65b103ac1a87
        labels:
          env: demo
          service: gateway
    authorization:
      type: Bearer
      credentials: "REPLACE_WITH_METRICS_SCRAPER_KEY"

  # Start exporter: docker compose -f docker-compose.yml -f docker-compose.prod.yml \
  #   --profile observability up -d postgres-exporter
  - job_name: ai-mesh-postgres-exporter
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["127.0.0.1:9187"]
        labels:
          env: demo
          service: postgres
