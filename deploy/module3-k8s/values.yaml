# Module 3 Phase 2 — Kind/Helm values
nameOverride: module3-k8s
namespace: ai-mesh-m3

controlUrl: http://host.docker.internal:8100
agentApiKey: ""
organizationSlug: zeroshield
clusterName: kind-module3

images:
  agent: module3-mesh-agent:0.1.0
  river: module3-river:0.1.0
  # Public placeholder apps; AI process uses python http.server + Envoy sidecar
  envoy: envoyproxy/envoy:v1.29.3
  redis: redis:7-alpine
  # Busybox/python for demo model + vector DB
  python: python:3.12-alpine

agent:
  enabled: true
  heartbeatSeconds: 30
  probeUnauthorized: true

river:
  enabled: true
  anomalyThreshold: 0.85
  pollSeconds: 10

workloads:
  enabled: true

redis:
  enabled: true

networkPolicy:
  enabled: true
  # true = CiliumNetworkPolicy; false = standard networking.k8s.io/NetworkPolicy
  cilium: false

mtls:
  # Demo certs generated by job at install time into secret module3-mtls
  secretName: module3-mtls
