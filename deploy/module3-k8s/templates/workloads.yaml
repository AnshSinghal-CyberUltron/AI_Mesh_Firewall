{{- if .Values.workloads.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: module3-envoy-config
  namespace: {{ .Values.namespace }}
data:
  vector-db-envoy.yaml: |
    static_resources:
      listeners:
        - name: mtls_ingress
          address:
            socket_address: { address: 0.0.0.0, port_value: 8443 }
          filter_chains:
            - transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  common_tls_context:
                    tls_certificates:
                      - certificate_chain: { filename: "/etc/certs/tls.crt" }
                        private_key: { filename: "/etc/certs/tls.key" }
                    validation_context:
                      trusted_ca: { filename: "/etc/certs/ca.crt" }
              filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: vdb_mtls
                    route_config:
                      name: local
                      virtual_hosts:
                        - name: backend
                          domains: ["*"]
                          routes:
                            - match: { prefix: "/" }
                              route: { cluster: local_vdb }
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: local_vdb
          connect_timeout: 1s
          type: STATIC
          load_assignment:
            cluster_name: local_vdb
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: 127.0.0.1, port_value: 8000 }
  ai-model-envoy.yaml: |
    static_resources:
      listeners:
        - name: egress
          address:
            socket_address: { address: 127.0.0.1, port_value: 19000 }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: model_egress
                    route_config:
                      name: to_vdb
                      virtual_hosts:
                        - name: vdb
                          domains: ["*"]
                          routes:
                            - match: { prefix: "/" }
                              route:
                                cluster: vector_db_mtls
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: vector_db_mtls
          connect_timeout: 2s
          type: STRICT_DNS
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                tls_certificates:
                  - certificate_chain: { filename: "/etc/certs/tls.crt" }
                    private_key: { filename: "/etc/certs/tls.key" }
                validation_context:
                  trusted_ca: { filename: "/etc/certs/ca.crt" }
          load_assignment:
            cluster_name: vector_db_mtls
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: vector-db
                          port_value: 8443
  llm-edge-envoy.yaml: |
    static_resources:
      listeners:
        - name: llm_edge
          address:
            socket_address: { address: 0.0.0.0, port_value: 8080 }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: llm_edge
                    route_config:
                      name: local_llm
                      virtual_hosts:
                        - name: llm
                          domains: ["*"]
                          routes:
                            - match: { prefix: "/" }
                              route: { cluster: local_llm_stub }
                    http_filters:
                      - name: envoy.filters.http.ext_authz
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                          transport_api_version: V3
                          failure_mode_allow: false
                          http_service:
                            server_uri:
                              uri: http://module3-authz-shim:9191
                              cluster: authz_shim
                              timeout: 2s
                            authorization_request:
                              allowed_headers:
                                patterns:
                                  - exact: x-tenant-id
                                  - exact: x-environment
                                  - exact: x-estimated-tokens
                                  - exact: ":path"
                            path_prefix: /
                          status_on_error:
                            code: Forbidden
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: authz_shim
          connect_timeout: 2s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: authz_shim
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: module3-authz-shim, port_value: 9191 }
        - name: local_llm_stub
          connect_timeout: 1s
          type: STATIC
          load_assignment:
            cluster_name: local_llm_stub
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: 127.0.0.1, port_value: 8000 }
---
# Localhost gauntlet: DB binds 127.0.0.1:8000; Envoy exposes mTLS :8443
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vector-db
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vector-db
      role: vector-db
  template:
    metadata:
      labels:
        app: vector-db
        role: vector-db
    spec:
      containers:
        - name: vector-db
          image: {{ .Values.images.python }}
          command: ["python", "-m", "http.server", "8000", "--bind", "127.0.0.1"]
          # Intentionally no containerPort publish of 8000 on pod IP — localhost only
        - name: envoy
          image: {{ .Values.images.envoy }}
          args: ["-c", "/etc/envoy/vector-db-envoy.yaml", "--log-level", "info"]
          ports:
            - containerPort: 8443
              name: mtls
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
            - name: certs
              mountPath: /etc/certs
              readOnly: true
      volumes:
        - name: envoy-config
          configMap:
            name: module3-envoy-config
        - name: certs
          secret:
            secretName: {{ .Values.mtls.secretName }}
---
apiVersion: v1
kind: Service
metadata:
  name: vector-db
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: vector-db
  ports:
    - name: mtls
      port: 8443
      targetPort: 8443
    # Deliberately NOT exposing raw DB port 8000 as a Service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-model
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-model
      role: ai-model
  template:
    metadata:
      labels:
        app: ai-model
        role: ai-model
    spec:
      containers:
        - name: model
          image: {{ .Values.images.python }}
          command:
            - sh
            - -c
            - |
              python - <<'PY'
              import http.server, socketserver
              class H(http.server.BaseHTTPRequestHandler):
                  def do_GET(self):
                      self.send_response(200); self.end_headers(); self.wfile.write(b"ai-model-ok")
                  def log_message(self, *a): pass
              socketserver.TCPServer(("0.0.0.0", 8080), H).serve_forever()
              PY
          ports:
            - containerPort: 8080
        - name: envoy
          image: {{ .Values.images.envoy }}
          args: ["-c", "/etc/envoy/ai-model-envoy.yaml", "--log-level", "info"]
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
            - name: certs
              mountPath: /etc/certs
              readOnly: true
      volumes:
        - name: envoy-config
          configMap:
            name: module3-envoy-config
        - name: certs
          secret:
            secretName: {{ .Values.mtls.secretName }}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-model
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: ai-model
  ports:
    - port: 8080
      targetPort: 8080
---
{{- if .Values.llmEdge.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-edge
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-edge
      role: llm-edge
  template:
    metadata:
      labels:
        app: llm-edge
        role: llm-edge
    spec:
      containers:
        - name: llm-stub
          image: {{ .Values.images.python }}
          command:
            - sh
            - -c
            - |
              python - <<'PY'
              import http.server, socketserver
              class H(http.server.BaseHTTPRequestHandler):
                  def do_GET(self):
                      self.send_response(200); self.end_headers(); self.wfile.write(b"llm-edge-ok")
                  def do_POST(self):
                      self.do_GET()
                  def log_message(self, *a): pass
              socketserver.TCPServer(("127.0.0.1", 8000), H).serve_forever()
              PY
        - name: envoy
          image: {{ .Values.images.envoy }}
          args: ["-c", "/etc/envoy/llm-edge-envoy.yaml", "--log-level", "info"]
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
      volumes:
        - name: envoy-config
          configMap:
            name: module3-envoy-config
---
apiVersion: v1
kind: Service
metadata:
  name: llm-edge
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: llm-edge
  ports:
    - name: http
      port: 8080
      targetPort: 8080
{{- end }}
{{- end }}
