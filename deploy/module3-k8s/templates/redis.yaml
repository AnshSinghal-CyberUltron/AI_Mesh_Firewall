{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: module3-redis
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: module3-redis
  template:
    metadata:
      labels:
        app: module3-redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.images.redis }}
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: module3-redis
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: module3-redis
  ports:
    - port: 6379
      targetPort: 6379
{{- end }}
