apiVersion: v1
kind: Secret
metadata:
  name: module3-agent-credentials
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  AGENT_API_KEY: {{ required "agentApiKey is required" .Values.agentApiKey | quote }}
  ORGANIZATION_SLUG: {{ .Values.organizationSlug | quote }}
  CONTROL_URL: {{ .Values.controlUrl | quote }}
  CLUSTER_NAME: {{ .Values.clusterName | quote }}
