# zeroshield.ai production vhosts (all DNS → same EC2).
# TLS: terminate at ALB/CloudFront or add certbot + listen 443 blocks.

# PERF: compress text assets. The SPA JS bundle is ~1.77MB uncompressed; gzip
# cuts the cold-load transfer ~3.7x (→~475KB). conf.d/*.conf is included inside
# the http{} context, so these http-level directives apply to every vhost below.
# (The base image ships gzip COMMENTED OUT with a html-only default gzip_types,
# so JS/CSS/JSON were served raw until this block.)
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types application/javascript application/x-javascript text/javascript text/css text/plain text/xml application/xml application/json image/svg+xml application/wasm font/ttf font/otf application/vnd.ms-fontobject;

# SECURITY headers (defense-in-depth, applied http-wide to every vhost in this
# and 02-ssl.conf). nginx add_header is NOT inherited once a block defines its
# own add_header, so the /assets/ location blocks repeat these. HSTS uses a
# conservative max-age without includeSubDomains so sibling subdomains are
# unaffected; CSP is frame-ancestors-only to stop clickjacking without risking
# the SPA's inline assets. (Cloudflare edge min-TLS 1.2 is a separate dashboard
# toggle — not settable from origin nginx.)
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000" always;

# ── aimeshfirewall.zeroshield.ai — React UI + /api proxy (SPA uses relative /api/*) ──
server {
    listen 80;
    server_name aimeshfirewall.zeroshield.ai;
    client_max_body_size 64m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://control:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
    }

    location /ws/ {
        proxy_pass http://control:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
    }

    # Same-origin gateway proxy (avoids cross-origin CORS to aimeshgateway.*)
    location /v1/ {
        proxy_pass http://gateway:8300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
        chunked_transfer_encoding on;
    }

    location /gateway/ {
        proxy_pass http://gateway:8300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 360s;
    }

    location = /gw-health {
        proxy_pass http://gateway:8300/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /assets/ {
        # PERF: fingerprinted (content-hashed) build assets are immutable — cache
        # 1 year in the browser AND at the Cloudflare edge so repeat visits skip
        # the ~475KB JS bundle entirely. (Cloudflare's default Browser Cache TTL
        # was overriding to 4h; an explicit immutable header is respected.)
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── aimeshbackend.zeroshield.ai — Django control /api ──
server {
    listen 80;
    server_name aimeshbackend.zeroshield.ai;
    client_max_body_size 64m;

    location / {
        proxy_pass http://control:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
    }

    location /ws/ {
        proxy_pass http://control:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
    }
}

# ── aimeshgateway.zeroshield.ai — inference gateway (OpenAI-compatible) ──
server {
    listen 80;
    server_name aimeshgateway.zeroshield.ai;
    client_max_body_size 64m;

    location = /metrics {
        proxy_pass http://gateway:8300/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Metrics-Scraper-Key $http_x_metrics_scraper_key;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        proxy_pass http://gateway:8300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
        chunked_transfer_encoding on;
    }
}

# Fallback: direct IP / unknown Host → firewall UI
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 32m;
    root /usr/share/nginx/html;
    index index.html;
    location /assets/ {
        # PERF: fingerprinted (content-hashed) build assets are immutable — cache
        # 1 year in the browser AND at the Cloudflare edge so repeat visits skip
        # the ~475KB JS bundle entirely. (Cloudflare's default Browser Cache TTL
        # was overriding to 4h; an explicit immutable header is respected.)
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
