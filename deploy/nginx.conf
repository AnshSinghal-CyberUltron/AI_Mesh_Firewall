# zeroshield.ai production vhosts (all DNS → same EC2).
# TLS: terminate at ALB/CloudFront or add certbot + listen 443 blocks.

# ── aimeshfirewall.zeroshield.ai — React UI + /api proxy (SPA uses relative /api/*) ──
server {
    listen 80;
    server_name aimeshfirewall.zeroshield.ai;
    client_max_body_size 64m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://control:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
    }

    location /ws/ {
        proxy_pass http://control:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
    }

    # Same-origin gateway proxy (avoids cross-origin CORS to aimeshgateway.*)
    location /v1/ {
        proxy_pass http://gateway:8300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
        chunked_transfer_encoding on;
    }

    location /gateway/ {
        proxy_pass http://gateway:8300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 360s;
    }

    location = /gw-health {
        proxy_pass http://gateway:8300/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── aimeshbackend.zeroshield.ai — Django control /api ──
server {
    listen 80;
    server_name aimeshbackend.zeroshield.ai;
    client_max_body_size 64m;

    location / {
        proxy_pass http://control:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
    }

    location /ws/ {
        proxy_pass http://control:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
    }
}

# ── aimeshgateway.zeroshield.ai — inference gateway (OpenAI-compatible) ──
server {
    listen 80;
    server_name aimeshgateway.zeroshield.ai;
    client_max_body_size 64m;

    location / {
        proxy_pass http://gateway:8300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
        chunked_transfer_encoding on;
    }
}

# Fallback: direct IP / unknown Host → firewall UI
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 32m;
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
