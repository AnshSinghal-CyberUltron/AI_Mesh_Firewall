# HTTPS for Cloudflare "Full" mode (self-signed origin cert in /etc/nginx/ssl/).
# Cloudflare SSL must be "Full" (not "Full strict") OR use a Cloudflare Origin Certificate.

ssl_certificate     /etc/nginx/ssl/origin.crt;
ssl_certificate_key /etc/nginx/ssl/origin.key;

server {
    listen 443 ssl;
    http2 on;
    server_name aimeshfirewall.zeroshield.ai;
    client_max_body_size 64m;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://control:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /ws/ {
        proxy_pass http://control:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /v1/ {
        proxy_pass http://gateway:8300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
        chunked_transfer_encoding on;
    }

    location /gateway/ {
        proxy_pass http://gateway:8300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 360s;
    }

    location = /gw-health {
        proxy_pass http://gateway:8300/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenAI-SDK reference demo (superuser-gated) — mirror deploy/nginx.conf :80 block.
    location = /demo { return 301 /demo/; }
    location /demo/ {
        auth_basic "ZeroShield Demo (superuser)";
        auth_basic_user_file /etc/nginx/demo.htpasswd;
        client_max_body_size 64m;

        resolver 127.0.0.11 ipv6=off valid=30s;
        set $demo_upstream "demo:8770";
        rewrite ^/demo/(.*)$ /$1 break;
        proxy_pass http://$demo_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
        chunked_transfer_encoding on;
    }

    location /assets/ {
        # PERF: fingerprinted (content-hashed) build assets are immutable — cache
        # 1 year in the browser AND at the Cloudflare edge so repeat visits skip
        # the ~475KB JS bundle entirely. (Cloudflare's default Browser Cache TTL
        # was overriding to 4h; an explicit immutable header is respected.)
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name aimeshbackend.zeroshield.ai;
    client_max_body_size 64m;
    location / {
        proxy_pass http://control:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
    }
    location /ws/ {
        proxy_pass http://control:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name aimeshgateway.zeroshield.ai;
    client_max_body_size 64m;

    # Prometheus scrape (gateway enforces METRICS_SCRAPER_KEY)
    location = /metrics {
        proxy_pass http://gateway:8300/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Metrics-Scraper-Key $http_x_metrics_scraper_key;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        proxy_pass http://gateway:8300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
        chunked_transfer_encoding on;
    }
}
