# T02 baked SPA on :80. Proxies match deploy/nginx.conf firewall vhost.
# Fault-control paths for the synthetic recorder are NOT proxied here.

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 64m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $control_upstream "control:8000";
        proxy_pass http://$control_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location /ws/ {
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $control_upstream "control:8000";
        proxy_pass http://$control_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /v1/ {
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $gateway_upstream "gateway:8300";
        proxy_pass http://$gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
        chunked_transfer_encoding on;
    }

    location /gateway/ {
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $gateway_upstream "gateway:8300";
        proxy_pass http://$gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 360s;
    }

    location = /gw-health {
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $gateway_health "gateway:8300";
        proxy_pass http://$gateway_health/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
