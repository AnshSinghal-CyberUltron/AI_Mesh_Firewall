                            - listitem [ref=e2193]: ZeroShield adjudication — when Dynamic Routing is enabled, the ZeroShield Policy Adjudicator analyzes candidate scores plus request context (data sensitivity, compliance requirements, token budget/cost pressure, latency SLA, and risk) and decides whether to keep the preferred model or reroute.
                            - listitem [ref=e2194]: "API output + audit — every chat-completion response includes routing metadata and headers (`selected_model`, `original_model`, `rerouted`, `routing_reason`, `decision_source`, `policy_summary`, `decision_factors`) and emits the same decision as telemetry."
