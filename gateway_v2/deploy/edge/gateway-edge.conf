# v2 edge for the gateway_v2 serving path (GW16b, B5). Contrast with the v1 deploy/nginx.conf,
# whose /v1/ location has NO upstream keepalive block (the measured 0.9986-conns/request /
# 502-above-420-RPS defect) and NO X-Accel-Buffering: no. This v2 edge fixes both.

upstream b3_gateway {
    # ${B3_UPSTREAM} is an envsubst placeholder resolved to the B3 host:port at container
    # start (default host.docker.internal:8300); the stock nginx image templates it via
    # /docker-entrypoint.d/ so the literal directives below survive substitution.
    server ${B3_UPSTREAM};
    # keepalive 64 is THE fix for the v1 0.9986-conns/request / 502-above-420-RPS defect:
    # a pooled upstream connection is reused instead of one new TCP connection per request.
    keepalive 64;
    # keepalive_timeout 30s + keepalive_requests 1000 align connection recycling to
    # RV_CONN_MAX_AGE_S (30s, the B3 uvicorn timeout_keep_alive) — the per-connection
    # NLB-balance reason: a scaled-out gateway only receives traffic once pooled connections
    # recycle on the same bounded age the gateway recycles on.
    keepalive_timeout 30s;
    keepalive_requests 1000;
}

server {
    listen 80;
    server_name gateway.local;
    server_tokens off;
    client_max_body_size 64m;

    location / {
        proxy_pass http://b3_gateway;
        proxy_http_version 1.1;
        # Clearing the hop-by-hop Connection header is what lets nginx reuse the pooled
        # upstream connection rather than close it after each request (keepalive correctness).
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE transparency MECHANISM: X-Accel-Buffering: no (not proxy_buffering). The upstream
        # hint + the client-facing response header disable edge buffering so each token is
        # passed through in its own read; proxy_buffering off below is defence in depth only.
        proxy_set_header X-Accel-Buffering no;
        add_header X-Accel-Buffering no always;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        # proxy_read_timeout 400s covers a stream lasting longer than 350s (L16b-4 config
        # support); proxy_send_timeout matches it.
        proxy_read_timeout 400s;
        proxy_send_timeout 400s;

        include /etc/nginx/edge/security-headers.inc;
    }
}

# NOTE: the default_server unknown-Host 403 catch-all (task 2.3) is appended BELOW this line.
# Unknown-Host rejection (CWE-1021 Host isolation): a request whose Host does not match the
# named server above is NOT proxied and does NOT fall through to named content — it is rejected 403.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    location / {
        return 403;
    }
}

