#
# Edge_Drain_Contract (R8.1): on MIG scale-in the regional external passthrough NLB drains
# 300 s before VM deletion + SIGTERM, so in-flight streams up to ~375 s survive. The in-gateway
# drain is owned by B3 (serve.py install_drain_hook: RV_DRAIN_ACCEPT_S 15s + RV_DRAIN_S 60s,
# driving the GW19 ACCEPTING->DRAINING->TERMINATING->FLUSHED->EXITED machine). B5 documents only
# the edge/NLB side; it builds no drain code and simulates no fleet drill.
#
# Settled topology (R8.2): regional external passthrough NLB -> gateways (Option A), TLS in the
# gateway tier. The regional ALB is REJECTED for token streams (+8-10 ms p99). The NLB balances
# per connection, which is why keepalive recycling is aligned to RV_CONN_MAX_AGE_S (30s) above.
#
# Deferred_Seams (each named with its owning card/gate; nothing scaffolded here):
#   - NLB bake-off vs ALB ................................. cloud / GW20 (R8.2)
#   - TLS termination cost at 600 RPS .................... G-10 (R8.3) — knob DEFINED (uvicorn
#       ssl_keyfile/ssl_certfile on serve.py's host, OR an edge `listen 443 ssl` note), cost
#       deferred; no cert handling scaffolded.
#   - Internet-vantage latency ........................... G-11 (R8.4) — no measurement scaffolded.
#   - Store outage behind a health-checked NLB ........... G-13 (R8.5) — no drill scaffolded.
#   - Edge >= 2x fleet qualified RPS @ <1 ms p99 ......... L16b-2 / GW20 (R8.6).
#   - Full > 350 s healthy-stream soak ................... L16b-4 (R8.6) — proxy_read_timeout 400s
#       above supports it; the full soak is deferred.
#   - Drain one gateway during active streams ............ L16b-5 (R8.6) — documented via the
#       Edge_Drain_Contract above; the fleet drill is deferred.
# =============================================================================================
