[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gateway-v2"
version = "0.0.0"
description = "AI Mesh Firewall gateway v2 — workspace + OpenAI conformance + parity harness"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "redis>=8.1,<9",
]

[project.optional-dependencies]
dev = [
    "fakeredis>=2.26",
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.1",
]
# GW15 in-process conformance subset deps (``tests/openai_conformance/test_gw15_chat_surface_v2.py``):
# the UNMODIFIED stock OpenAI Python SDK + httpx (the in-process ASGITransport) + pytest-asyncio.
# The subset ``importorskip``s ``openai`` / ``httpx``, so these are optional — a tree without them
# skips the subset cleanly rather than failing collection. Install with ``.[dev,conformance]``.
conformance = [
    "openai>=1.0",
    "httpx>=0.27",
    "pytest-asyncio>=0.23",
]
# B3 Serving_Entrypoint host deps (``gateway_v2/edge/serve.py`` hosts ``build_app`` under uvicorn).
# ``uvicorn[standard]`` pulls uvloop + httptools for the modern ``loop="auto"``/``http="auto"`` config.
# ``serve.py`` lazy-imports uvicorn inside ``main`` (ImportError → ``pip install 'gateway-v2[serve]'``
# hint), so the base package stays framework-free (``[project].dependencies`` is ``psycopg`` + ``redis``
# only) and a tree that only runs the pure suite is unaffected — mirroring the optional ``conformance``
# extra above.
serve = [
    "uvicorn[standard]>=0.30",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gateway_v2*", "state_control*", "audit_control*", "lint*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# The GW15 in-process conformance subset (``tests/openai_conformance/test_gw15_chat_surface_v2.py``)
# runs against the v2 Chat_Surface with the unmodified OpenAI SDK + ``StubProviderClient`` and is
# collected by default (it ``importorskip``s the SDK, so a tree without ``openai`` skips cleanly;
# it carries its own ``pytest.mark.asyncio`` so pytest-asyncio's default strict mode drives it).
# The remaining ``tests/openai_conformance/*`` files are the V1 SDK-compat suite + the DEFERRED
# live gates (real-TCP / Node SDK / uvicorn / the C2 replay): they target the v1 ``ai_mesh_gateway``
# app (a separate CI job installs the v1 deps + PYTHONPATH) or stand up a real socket, so they stay
# ignored here.
# B3 note (task 7.2 — DONE): ``test_live_tcp_8300.py`` is turned ON here (its ``--ignore`` line is
# removed, so it is COLLECTED). It no longer hard-imports ``openai`` + ``httpx`` at module scope —
# task 7.2 converted those to ``pytest.importorskip`` — so on a framework-free ``.[dev]`` tree it
# skips cleanly at collection instead of ERRORing. Its ``pytest.mark.skipif`` on
# ``AMF_CONFORMANCE_BASE_URL`` additionally skips it at run-time when no live server URL is wired, so
# the default framework-free ``pytest`` run (no conformance extra, env unset) stays green: the module
# importorskips the SDK and the skipif leaves it unselected. Its RUN-GREEN counterpart lives in
# ``test_b3_live_serve.py`` (the booted gateway_v2 child + the same R5.5 SDK-visible contract over
# the real socket). ``test_openai_sdk_compat_live_uvicorn.py`` below targets the OLD v1 gateway
# (``ai_mesh_gateway.main``), NOT gateway_v2 — it is out of B3 scope and stays ignored.
# ``tests/parity`` is the v1 parity harness, also a separate job.
addopts = """
    --ignore=tests/parity
    --ignore=tests/openai_conformance/stub_server.py
    --ignore=tests/openai_conformance/node
    --ignore=tests/openai_conformance/test_malformed_sse_frame.py
    --ignore=tests/openai_conformance/test_mcp_rag_vector_shapes.py
    --ignore=tests/openai_conformance/test_openai_sdk_compat.py
    --ignore=tests/openai_conformance/test_openai_sdk_compat_live_uvicorn.py
    --ignore=tests/openai_conformance/test_openai_sdk_compat_phase2.py
    --ignore=tests/openai_conformance/test_openai_sdk_compat_phase2_adversarial.py
    --ignore=tests/openai_conformance/test_openai_sdk_compat_phase5_correlation.py
    --ignore=tests/openai_conformance/test_openai_sdk_compat_phase6_guards.py
"""

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["gateway_v2", "state_control", "audit_control", "lint", "tests"]
extend-exclude = [
    "tests/openai_conformance/test_openai_sdk_compat.py",
    "tests/openai_conformance/test_openai_sdk_compat_live_uvicorn.py",
    "tests/openai_conformance/test_openai_sdk_compat_phase2.py",
    "tests/openai_conformance/test_openai_sdk_compat_phase2_adversarial.py",
    "tests/openai_conformance/test_openai_sdk_compat_phase5_correlation.py",
    "tests/openai_conformance/test_openai_sdk_compat_phase6_guards.py",
    "tests/openai_conformance/stub_server.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["gateway_v2", "state_control", "audit_control", "lint"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["gateway_v2", "state_control", "audit_control", "lint"]

[[tool.mypy.overrides]]
module = ["ai_mesh_gateway.*"]
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["gateway_v2"]

[[tool.importlinter.contracts]]
name = "Gateway v2 layers"
type = "layers"
layers = [
    "gateway_v2.edge",
    "gateway_v2.admit",
    "gateway_v2.plan",
    "gateway_v2.detect",
    "gateway_v2.resolve",
    "gateway_v2.dispatch",
    "gateway_v2.egress",
    "gateway_v2.audit",
    "gateway_v2.runtime",
    "gateway_v2.contracts",
    "gateway_v2.domain",
]

[[tool.importlinter.contracts]]
name = "Resolve imports only domain"
type = "forbidden"
source_modules = ["gateway_v2.resolve"]
forbidden_modules = [
    "gateway_v2.edge",
    "gateway_v2.admit",
    "gateway_v2.plan",
    "gateway_v2.detect",
    "gateway_v2.dispatch",
    "gateway_v2.egress",
    "gateway_v2.audit",
    "gateway_v2.runtime",
    "gateway_v2.contracts",
]
