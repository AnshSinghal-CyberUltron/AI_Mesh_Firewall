# LOCAL-ONLY overrides (see docker-compose.yml for base stack).
services:
  control:
    environment:
      VECTOR_PROVIDER_ALLOW_PRIVATE: "1"
  gateway:
    environment:
      # Demo/local: synchronous RAG ingest so documents are queryable without
      # the vector.index Celery worker profile.
      GATEWAY_ASYNC_VECTOR_INGEST: "false"
