# LOCAL-ONLY overrides (safe to delete for prod-like runs).
# - Email kill-switch (no real Graph sends from dev)
# See docker-compose.yml for base stack.
# Reversible: delete this file, then `docker compose up -d`.
services:
  control:
    environment:
      VECTOR_PROVIDER_ALLOW_PRIVATE: "1"
  gateway:
    environment:
      GATEWAY_ASYNC_VECTOR_INGEST: "false"
      VECTOR_PROVIDER_ALLOW_PRIVATE: "1"
      # Outbound HTTPS to OpenAI/BYOK providers inside the container.
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      # Local dev: Windows/corporate TLS inspection often breaks container trust stores.
      SSL_VERIFY: "false"
