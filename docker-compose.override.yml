# LOCAL-ONLY overrides (see docker-compose.yml for base stack).
services:
  control:
    environment:
      VECTOR_PROVIDER_ALLOW_PRIVATE: "1"
  gateway:
    environment:
      # Demo/local: synchronous RAG ingest so documents are queryable without
      # the vector.index Celery worker profile.
      GATEWAY_ASYNC_VECTOR_INGEST: "false"
  frontend:
    # T02: pin baked nginx. A recreate of the Vite service would restore bind-mounts.
    image: ai-mesh-nginx-t00:t02
    command: ["nginx", "-g", "daemon off;"]
    working_dir: /
    volumes: !reset []
    ports: !override
      - "8180:80"
    environment: !reset {}
    depends_on:
      control:
        condition: service_healthy
      gateway:
        condition: service_started

