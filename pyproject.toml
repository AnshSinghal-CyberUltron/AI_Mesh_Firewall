[project]
name = "ai-mesh-firewall-workspace"
version = "0.1.0"
description = "Standalone AI Mesh Firewall product workspace"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["shared", "gateway", "control", "workers"]
asyncio_mode = "auto"
markers = [
    "integration: integration tests requiring live mongo/redis/postgres",
    "g1_hmac: Phase-0 G1 — HMAC failure observability + misconfig 503",
    "g2_per_org: Phase-0 G2 — per-org tier2_enabled tri-state resolution",
    "g3_breaker: Phase-0 G3 — Bedrock Tier-2 circuit breaker FSM",
    "cc1_index: Phase-0 CC-1 — Postgres composite index ev_org_evclass_ts_idx",
    "cc2_resilience: Phase-0 CC-2 — gateway survives Mongo sink failure",
]
