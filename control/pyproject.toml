[project]
name = "backend"
version = "0.1.0"
description = "ZeroShield Control Plane — Django-based policy, identity, and audit management"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34.0",
    "celery>=5.3",
    "channels>=4.0",
    "channels-redis>=4.0",
    "cryptography>=43.0.0",
    "daphne>=4.0",
    "dataclasses-json==0.6.3",
    "django>=6.0",
    "django-cors-headers>=4.0",
    "djangorestframework>=3.16",
    "djangorestframework-simplejwt>=5.3",
    "django-redis>=5.4.0",
    "drf-spectacular>=0.27.0",
    "gunicorn>=22.0",
    "httpx>=0.27.0",
    "jsonschema>=4.20.0",
    "msal>=1.28.0",
    "python-dotenv>=1.0.0",
    "psycopg[binary]>=3.2.0",
    "redis>=5.0.0",
    "regex==2024.11.6",
    "requests>=2.31.0",
    "uvicorn[standard]>=0.24.0",
    "whitenoise[brotli]>=6.6",
    # Async RAG vector-ingest worker (vector_ingest_task): per-org BYOK embed +
    # vector upsert reuse the gateway's vector_client/byok_embedder, which need
    # these (matched to gateway/pyproject.toml pins).
    "litellm>=1.30.0",
    "pinecone>=5.0.0",
    "pymilvus>=2.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "fakeredis>=2"]
