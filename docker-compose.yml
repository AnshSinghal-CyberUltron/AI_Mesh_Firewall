# AI Mesh Firewall — standalone product (dev)
# UI :8180  Control :8100  Gateway :8300  RabbitMQ UI :15772

name: ai_mesh_firewall

services:
  postgres:
    image: pgvector/pgvector:pg16
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_mesh_firewall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_mesh_firewall}
      POSTGRES_DB: ${POSTGRES_DB:-ai_mesh_firewall}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_mesh_firewall}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    # 7.2+ required for CLIENT MAINT_NOTIFICATIONS (redis-py handshake)
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  # Phase 1 F-3.1: local ChromaDB for the RAG Collection Manager.
  # Lightweight, no external creds needed. Persisted to a named volume so
  # collections survive container recreates.
  chromadb:
    profiles: ["chroma"]
    image: chromadb/chroma:0.5.20
    ports: ["8001:8000"]
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
      PERSIST_DIRECTORY: /chroma/chroma
    volumes: [chroma_data:/chroma/chroma]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/heartbeat', timeout=2).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    ports: ["5772:5672", "15772:15672"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      # Cold start on Windows Docker can exceed 2 min; allow enough grace before marking unhealthy.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 180s

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
    profiles: ["telemetry-pilot"]

  control:
    build:
      context: .
      dockerfile: control/Dockerfile
    ports: ["8100:8000"]
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: main_app.settings
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_mesh_firewall}:${POSTGRES_PASSWORD:-ai_mesh_firewall}@postgres:5432/${POSTGRES_DB:-ai_mesh_firewall}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-change-me}
      POLICY_SIGNING_KEY: ${POLICY_SIGNING_KEY:-}
      DEBUG: "true"
      ALLOWED_HOSTS: "localhost,127.0.0.1,control,host.docker.internal"
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://127.0.0.1:8180}
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-http://127.0.0.1:8180}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://127.0.0.1:8180}
      # Phase 1 Fx-2b: server-to-server admin proxy (control -> gateway)
      GATEWAY_URL: http://gateway:8300
      GATEWAY_INTERNAL_API_KEY: ${GATEWAY_INTERNAL_API_KEY:-}
      # Security alerting email (Microsoft Graph application permissions)
      TENANT_ID: ${TENANT_ID:-}
      CLIENT_ID: ${CLIENT_ID:-}
      CLIENT_SECRET: ${CLIENT_SECRET:-}
      GRAPH_SENDER_EMAIL: ${GRAPH_SENDER_EMAIL:-support@zeroshield.ai}
      # Drain telemetry + send alert emails without requiring --profile workers
      TELEMETRY_DRAIN_MODE: ${TELEMETRY_DRAIN_MODE:-thread}
      TELEMETRY_DRAIN_INTERVAL_SEC: ${TELEMETRY_DRAIN_INTERVAL_SEC:-1.0}
      TELEMETRY_DRAIN_BATCH_SIZE: ${TELEMETRY_DRAIN_BATCH_SIZE:-250}
      ALERT_EMAIL_USE_CELERY: ${ALERT_EMAIL_USE_CELERY:-false}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 45s

  workers:
    build:
      context: .
      dockerfile: workers/Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: main_app.settings
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_mesh_firewall}:${POSTGRES_PASSWORD:-ai_mesh_firewall}@postgres:5432/${POSTGRES_DB:-ai_mesh_firewall}
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      REDIS_URL: redis://redis:6379/0
      TELEMETRY_DRAIN_MODE: ${TELEMETRY_DRAIN_MODE:-beat}
      TENANT_ID: ${TENANT_ID:-}
      CLIENT_ID: ${CLIENT_ID:-}
      CLIENT_SECRET: ${CLIENT_SECRET:-}
      GRAPH_SENDER_EMAIL: ${GRAPH_SENDER_EMAIL:-support@zeroshield.ai}
      ALERT_EMAIL_USE_CELERY: ${ALERT_EMAIL_USE_CELERY:-true}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-change-me}
      POLICY_SIGNING_KEY: ${POLICY_SIGNING_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_started }
      redis: { condition: service_healthy }

  workers-beat:
    build:
      context: .
      dockerfile: workers/Dockerfile
    restart: unless-stopped
    command: celery -A ai_mesh_workers.celery_app beat --loglevel=info
    environment:
      DJANGO_SETTINGS_MODULE: main_app.settings
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_mesh_firewall}:${POSTGRES_PASSWORD:-ai_mesh_firewall}@postgres:5432/${POSTGRES_DB:-ai_mesh_firewall}
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      REDIS_URL: redis://redis:6379/0
      TELEMETRY_DRAIN_MODE: beat
      TELEMETRY_DRAIN_INTERVAL_SEC: ${TELEMETRY_DRAIN_INTERVAL_SEC:-1.0}
      TELEMETRY_DRAIN_BATCH_SIZE: ${TELEMETRY_DRAIN_BATCH_SIZE:-250}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-change-me}
      POLICY_SIGNING_KEY: ${POLICY_SIGNING_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_started }
      redis: { condition: service_healthy }

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports: ["8300:8300"]
    env_file:
      - .env
    environment:
      AI_MESH_CONTROL_URL: http://control:8000
      AIGUARDX_BACKEND_URL: http://control:8000
      GATEWAY_REDIS_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
      POLICY_SIGNING_KEY: ${POLICY_SIGNING_KEY:-}
      GATEWAY_AUTH_ENABLED: "true"
      GATEWAY_ORG_ONLY_INFERENCE: "true"
      GATEWAY_ALLOW_HTTP: "1"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-change-me}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-${BEDROCK_REGION:-ap-south-1}}
      BEDROCK_REGION: ${BEDROCK_REGION:-ap-south-1}
      BEDROCK_MODEL: ${BEDROCK_MODEL:-openai.gpt-oss-120b-1:0}
      ENABLE_TIER2: ${ENABLE_TIER2:-true}
      GUARDRAILS_SERVICE_URL: http://guardrails:8310
      MCP_BROKER_URL: http://mcp-broker:8311
      VECTOR_SERVICE_URL: http://vector-retrieval:8312
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://127.0.0.1:8180}
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-http://127.0.0.1:8180}
      GATEWAY_CORS_ORIGINS: ${GATEWAY_CORS_ORIGINS:-http://127.0.0.1:8180,http://localhost:8180,http://127.0.0.1:5173,http://localhost:5173}
      # Phase 1 F-3.1: RAG firewall (vector backends via org config or --profile chroma).
      GATEWAY_RAG_ENABLED: ${GATEWAY_RAG_ENABLED:-true}
      CHROMA_URL: ${CHROMA_URL:-}
      # Default passthrough for local demos. Production Cosign: use
      # docker-compose.module3-verify.yml override (see docs/MODULE3_COSIGN_PRODUCTION.md).
      MODULE3_ADMISSION_MODE: ${MODULE3_ADMISSION_MODE:-passthrough}
      MODULE3_COSIGN_PUBLIC_KEY: ${MODULE3_COSIGN_PUBLIC_KEY:-}
      MODULE3_COSIGN_PUBLIC_KEY_PATH: ${MODULE3_COSIGN_PUBLIC_KEY_PATH:-}
      MODULE3_COSIGN_PUBLIC_KEY_FILE: ${MODULE3_COSIGN_PUBLIC_KEY_FILE:-}
      MODULE3_COSIGN_BINARY: ${MODULE3_COSIGN_BINARY:-cosign}
      MODULE3_COSIGN_TIMEOUT_SEC: ${MODULE3_COSIGN_TIMEOUT_SEC:-45}
      MODULE3_COSIGN_VERIFY_IMAGE: ${MODULE3_COSIGN_VERIFY_IMAGE:-0}
      MODULE3_COSIGN_EXTRA_ARGS: ${MODULE3_COSIGN_EXTRA_ARGS:-}
      GATEWAY_INTERNAL_API_KEY: ${GATEWAY_INTERNAL_API_KEY:-}
      # On-demand stdio MCP server fetch tuning. Packages are pulled via
      # npx/uvx at client connect time (NOT baked into the image); the first
      # connect must download+resolve the package before answering the MCP
      # initialize handshake, so the init timeout is generous while the shared
      # caches below make subsequent connects warm/fast.
      MCP_STDIO_INIT_TIMEOUT: ${MCP_STDIO_INIT_TIMEOUT:-120}
      MCP_STDIO_METHOD_TIMEOUT: ${MCP_STDIO_METHOD_TIMEOUT:-60}
      MCP_STDIO_HUNG_INIT_TIMEOUT: ${MCP_STDIO_HUNG_INIT_TIMEOUT:-180}
      MCP_STDIO_PACKAGE_ALLOWLIST: ${MCP_STDIO_PACKAGE_ALLOWLIST:-}
      UV_CACHE_DIR: /root/.cache/uv
      NPM_CONFIG_CACHE: /root/.npm
    volumes:
      - npm_cache:/root/.npm
      - uv_cache:/root/.cache/uv
      # Dir mount so secrets/cosign.pub can appear without recreate; missing pubkey
      # is ignored in passthrough and fail-closed in verify mode.
      - ./secrets:/run/secrets:ro
    depends_on:
      control: { condition: service_healthy }
      redis: { condition: service_healthy }

  guardrails:
    image: python:3.12-slim
    working_dir: /app
    command: pip install fastapi uvicorn && uvicorn main:app --host 0.0.0.0 --port 8310
    volumes: ["./services/guardrails/src:/app"]
    ports: ["8310:8310"]
    profiles: ["services"]

  mcp-broker:
    image: python:3.12-slim
    working_dir: /app
    command: pip install fastapi uvicorn && uvicorn main:app --host 0.0.0.0 --port 8311
    volumes: ["./services/mcp-broker/src:/app"]
    ports: ["8311:8311"]
    profiles: ["services"]

  # Submodule 1.4 hermetic MCP stub — deterministic target for live UI tests.
  # Implements streamable-http MCP at http://mcp-stub:9999/mcp .
  # Always-on (no profile) so the frontend "Add MCP Server" flow can reach it.
  mcp-stub:
    image: python:3.12-slim
    working_dir: /app
    command: sh -c "pip install --quiet fastapi uvicorn && uvicorn main:app --host 0.0.0.0 --port 9999"
    volumes: ["./services/mcp-stub/src:/app"]
    ports: ["9999:9999"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9999/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  vector-retrieval:
    image: python:3.12-slim
    working_dir: /app
    command: pip install fastapi uvicorn && uvicorn main:app --host 0.0.0.0 --port 8312
    volumes: ["./services/vector-retrieval/src:/app"]
    ports: ["8312:8312"]
    profiles: ["services"]

  frontend:
    image: node:22-alpine
    working_dir: /app
    # Use entrypoint placeholder so :8180 responds during npm install (avoids ERR_EMPTY_RESPONSE).
    command: ["sh", "/app/docker-entrypoint.sh"]
    volumes: ["./frontend:/app", "frontend_node_modules:/app/node_modules"]
    ports: ["127.0.0.1:8180:5173"]
    environment:
      VITE_CONTROL_PROXY: http://control:8000
      VITE_GATEWAY_PROXY: http://gateway:8300
      VITE_GATEWAY_BASE_URL: ${VITE_GATEWAY_BASE_URL:-http://127.0.0.1:8180}
      VITE_BACKEND_BASE_URL: ${VITE_BACKEND_BASE_URL:-http://127.0.0.1:8180}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5173/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 120s

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  mongo_data:
  chroma_data:
  npm_cache:
  uv_cache:
  frontend_node_modules:
