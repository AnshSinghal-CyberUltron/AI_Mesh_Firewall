# AI Mesh Firewall — standalone product (dev)
# UI :8180  Control :8100  Gateway :8300  RabbitMQ UI :15772
#
# MCP per-org Docker sandboxes (broker + sandbox image): enable with
#   docker compose --profile services up -d
# That starts mcp-broker (Docker socket mounted on broker ONLY), builds
# ai-mesh/mcp-sandbox:latest, and sets gateway MCP_STDIO_IN_PROCESS=false.

name: ai_mesh_firewall

services:
  postgres:
    image: pgvector/pgvector:pg16
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_mesh_firewall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_mesh_firewall}
      POSTGRES_DB: ${POSTGRES_DB:-ai_mesh_firewall}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_mesh_firewall}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    # 7.2+ required for CLIENT MAINT_NOTIFICATIONS (redis-py handshake)
    image: redis:7.4-alpine
    command: redis-server --appendonly yes --timeout 0 --tcp-keepalive 60
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  # Phase 1 F-3.1: local ChromaDB for the RAG Collection Manager.
  # Lightweight, no external creds needed. Persisted to a named volume so
  # collections survive container recreates.
  chromadb:
    profiles: ["chroma"]
    image: chromadb/chroma:0.5.20
    ports: ["8001:8000"]
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
      PERSIST_DIRECTORY: /chroma/chroma
    volumes: [chroma_data:/chroma/chroma]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/heartbeat', timeout=2).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5772:5672", "15772:15672"]
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 25s

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
    profiles: ["telemetry-pilot"]

  control:
    build:
      context: .
      dockerfile: control/Dockerfile
    # Image WORKDIR is /app/control; manage.py lives there. Django code (main_app/)
    # is under ai_mesh_control/ and is on PYTHONPATH (set in control/Dockerfile).
    working_dir: /app/control
    ports: ["8100:8000"]
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: main_app.settings
      # .env may set gateway PYTHONPATH — override so gunicorn/daphne resolve main_app.
      PYTHONPATH: /app/shared:/app/control/ai_mesh_control
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_mesh_firewall}:${POSTGRES_PASSWORD:-ai_mesh_firewall}@postgres:5432/${POSTGRES_DB:-ai_mesh_firewall}
      REDIS_URL: redis://redis:6379/0
      CHANNEL_LAYERS_REDIS_URL: redis://redis:6379/1
      ASGI_ALLOWED_ORIGINS: ${ASGI_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8180,http://127.0.0.1:8180}
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-change-me}
      POLICY_SIGNING_KEY: ${POLICY_SIGNING_KEY:-}
      DEBUG: "true"
      ALLOWED_HOSTS: "localhost,127.0.0.1,control"
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://127.0.0.1:8180}
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-http://127.0.0.1:8180}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://127.0.0.1:8180}
      # Phase 1 Fx-2b: server-to-server admin proxy (control -> gateway)
      GATEWAY_URL: http://gateway:8300
      GATEWAY_INTERNAL_API_KEY: ${GATEWAY_INTERNAL_API_KEY:-}
      TELEMETRY_DRAIN_MODE: ${TELEMETRY_DRAIN_MODE:-thread}
      TELEMETRY_DRAIN_INTERVAL_SEC: ${TELEMETRY_DRAIN_INTERVAL_SEC:-1.0}
      TELEMETRY_DRAIN_BATCH_SIZE: ${TELEMETRY_DRAIN_BATCH_SIZE:-250}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 45s

  workers:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: workers/Dockerfile
    environment:
      DJANGO_SETTINGS_MODULE: main_app.settings
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_mesh_firewall}:${POSTGRES_PASSWORD:-ai_mesh_firewall}@postgres:5432/${POSTGRES_DB:-ai_mesh_firewall}
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      REDIS_URL: redis://redis:6379/0
      TELEMETRY_DRAIN_MODE: ${TELEMETRY_DRAIN_MODE:-beat}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-change-me}
      POLICY_SIGNING_KEY: ${POLICY_SIGNING_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }

  workers-beat:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: workers/Dockerfile
    command: celery -A ai_mesh_workers.celery_app beat --loglevel=info
    environment:
      DJANGO_SETTINGS_MODULE: main_app.settings
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_mesh_firewall}:${POSTGRES_PASSWORD:-ai_mesh_firewall}@postgres:5432/${POSTGRES_DB:-ai_mesh_firewall}
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      REDIS_URL: redis://redis:6379/0
      TELEMETRY_DRAIN_MODE: beat
      TELEMETRY_DRAIN_INTERVAL_SEC: ${TELEMETRY_DRAIN_INTERVAL_SEC:-1.0}
      TELEMETRY_DRAIN_BATCH_SIZE: ${TELEMETRY_DRAIN_BATCH_SIZE:-250}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-change-me}
      POLICY_SIGNING_KEY: ${POLICY_SIGNING_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports: ["8300:8300"]
    env_file:
      - .env
    environment:
      AI_MESH_CONTROL_URL: http://control:8000
      AIGUARDX_BACKEND_URL: http://control:8000
      GATEWAY_REDIS_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
      POLICY_SIGNING_KEY: ${POLICY_SIGNING_KEY:-}
      GATEWAY_AUTH_ENABLED: "true"
      GATEWAY_ORG_ONLY_INFERENCE: "true"
      GATEWAY_ALLOW_HTTP: "1"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-change-me}
      # AWS creds are NOT pinned here: an empty ${AWS_ACCESS_KEY_ID:-} would
      # SHADOW the AWS credential chain (an explicit empty key makes boto3 fail
      # instead of falling back). Bedrock auth therefore resolves via the chain:
      # keys in env_file (.env) for local dev, or the EC2 instance role in prod.
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-${BEDROCK_REGION:-ap-south-1}}
      BEDROCK_REGION: ${BEDROCK_REGION:-ap-south-1}
      BEDROCK_MODEL: ${BEDROCK_MODEL:-global.anthropic.claude-haiku-4-5-20251001-v1:0}
      ENABLE_TIER2: ${ENABLE_TIER2:-true}
      GUARDRAILS_SERVICE_URL: http://guardrails:8310
      MCP_BROKER_URL: http://mcp-broker:8311
      MCP_BROKER_INTERNAL_KEY: ${MCP_BROKER_INTERNAL_KEY:-dev-mcp-broker-key-change-me}
      # Sandbox path: broker delegates stdio MCP to per-org containers (S9+).
      # Override MCP_STDIO_IN_PROCESS=true in .env for in-gateway dev fallback.
      MCP_STDIO_IN_PROCESS: ${MCP_STDIO_IN_PROCESS:-false}
      VECTOR_SERVICE_URL: http://vector-retrieval:8312
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://127.0.0.1:8180}
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-http://127.0.0.1:8180}
      GATEWAY_CORS_ORIGINS: ${GATEWAY_CORS_ORIGINS:-http://127.0.0.1:8180,http://localhost:8180,http://127.0.0.1:5173,http://localhost:5173}
      # Phase 1 F-3.1: RAG firewall (vector backends via org config or --profile chroma).
      GATEWAY_RAG_ENABLED: ${GATEWAY_RAG_ENABLED:-true}
      CHROMA_URL: ${CHROMA_URL:-}
      # On-demand stdio MCP server fetch tuning. Packages are pulled via
      # npx/uvx at client connect time (NOT baked into the image); the first
      # connect must download+resolve the package before answering the MCP
      # initialize handshake, so the init timeout is generous while the shared
      # caches below make subsequent connects warm/fast.
      MCP_STDIO_INIT_TIMEOUT: ${MCP_STDIO_INIT_TIMEOUT:-120}
      MCP_STDIO_METHOD_TIMEOUT: ${MCP_STDIO_METHOD_TIMEOUT:-60}
      MCP_STDIO_HUNG_INIT_TIMEOUT: ${MCP_STDIO_HUNG_INIT_TIMEOUT:-180}
      MCP_STDIO_PACKAGE_ALLOWLIST: ${MCP_STDIO_PACKAGE_ALLOWLIST:-}
      UV_CACHE_DIR: /root/.cache/uv
      NPM_CONFIG_CACHE: /root/.npm
    volumes:
      - npm_cache:/root/.npm
      - uv_cache:/root/.cache/uv
    depends_on:
      control: { condition: service_healthy }
      redis: { condition: service_healthy }
    # Phase-3 auto-recovery: the gateway was the only core service with neither a
    # healthcheck nor a restart policy (BACKSTOP CHG-0020: health=none → never
    # auto-restarted, and peers could not gate on service_healthy). /health is
    # auth-exempt and returns 200 {"status":"ok"} normally, 503 on a fatal
    # policy-signing misconfig — so an unhealthy gateway now reads unhealthy.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8300/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 60s

  guardrails:
    image: python:3.12-slim
    working_dir: /app
    command: pip install fastapi uvicorn && uvicorn main:app --host 0.0.0.0 --port 8310
    volumes: ["./services/guardrails/src:/app"]
    ports: ["8310:8310"]
    profiles: ["services"]

  mcp-sandbox-image:
    profiles: ["services"]
    image: ai-mesh/mcp-sandbox:latest
    build:
      context: .
      dockerfile: services/mcp-broker/sandbox-image/Dockerfile
    command: ["true"]
    restart: "no"

  mcp-broker:
    profiles: ["services"]
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/mcp-broker/Dockerfile
    ports: ["8311:8311"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      MCP_BROKER_INTERNAL_KEY: ${MCP_BROKER_INTERNAL_KEY:-dev-mcp-broker-key-change-me}
      MCP_SANDBOX_IMAGE: ai-mesh/mcp-sandbox:latest
      MCP_SANDBOX_NETWORK: mcp_sandbox_bridge
      MCP_SANDBOX_IDLE_TIMEOUT: ${MCP_SANDBOX_IDLE_TIMEOUT:-3600}
      MCP_BROKER_CONTAINER_NAME: ai_mesh_mcp_broker
    container_name: ai_mesh_mcp_broker
    networks:
      - default
      - mcp_sandbox_bridge
    depends_on:
      mcp-sandbox-image:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8311/health', timeout=10)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Submodule 1.4 hermetic MCP stub — deterministic target for live UI tests.
  # Implements streamable-http MCP at http://mcp-stub:9999/mcp .
  # Always-on (no profile) so the frontend "Add MCP Server" flow can reach it.
  mcp-stub:
    image: python:3.12-slim
    working_dir: /app
    command: sh -c "pip install --quiet fastapi uvicorn && uvicorn main:app --host 0.0.0.0 --port 9999"
    volumes: ["./services/mcp-stub/src:/app"]
    ports: ["9999:9999"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9999/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  vector-retrieval:
    image: python:3.12-slim
    working_dir: /app
    command: pip install fastapi uvicorn && uvicorn main:app --host 0.0.0.0 --port 8312
    volumes: ["./services/vector-retrieval/src:/app"]
    ports: ["8312:8312"]
    profiles: ["services"]

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes: ["./frontend:/app", "/app/node_modules"]
    ports: ["8180:5173"]
    environment:
      VITE_CONTROL_PROXY: http://control:8000
      VITE_GATEWAY_PROXY: http://gateway:8300
      VITE_GATEWAY_BASE_URL: ${VITE_GATEWAY_BASE_URL:-http://127.0.0.1:8180}
      VITE_BACKEND_BASE_URL: ${VITE_BACKEND_BASE_URL:-http://127.0.0.1:8180}
    depends_on:
      control: { condition: service_healthy }

volumes:
  postgres_data:
  redis_data:
  mongo_data:
  chroma_data:
  npm_cache:
  uv_cache:

networks:
  # Pre-created by tests/manual broker runs; external avoids compose label conflicts
  # when the network already exists. Run scripts/ensure_mcp_sandbox_network.sh first.
  mcp_sandbox_bridge:
    name: mcp_sandbox_bridge
    external: true
