# Production overlay — EC2 + ECR images + zeroshield.ai subdomains.
# Usage:
#   export ECR_REGISTRY=123456789.dkr.ecr.ap-south-1.amazonaws.com IMAGE_TAG=v1.0.0
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#   bash scripts/deploy-ec2.sh

name: ai_mesh_firewall

x-restart: &restart_unless_stopped
  restart: unless-stopped

x-ecr-gateway: &ecr_gateway_image
  image: ${ECR_REGISTRY:?set ECR_REGISTRY}/ai-mesh-gateway:${IMAGE_TAG:-latest}
  pull_policy: always
  build: !reset null

x-ecr-control: &ecr_control_image
  image: ${ECR_REGISTRY:?set ECR_REGISTRY}/ai-mesh-control:${IMAGE_TAG:-latest}
  pull_policy: always
  build: !reset null

x-ecr-workers: &ecr_workers_image
  image: ${ECR_REGISTRY:?set ECR_REGISTRY}/ai-mesh-workers:${IMAGE_TAG:-latest}
  pull_policy: always
  build: !reset null

services:
  postgres:
    <<: *restart_unless_stopped
    ports: !reset ["127.0.0.1:5432:5432"]
    command:
      - postgres
      - -c
      - shared_buffers=768MB
      - -c
      - effective_cache_size=2048MB
      - -c
      - max_connections=200
      - -c
      - work_mem=8MB
    deploy:
      resources:
        limits:
          memory: 3584M

  redis:
    <<: *restart_unless_stopped
    ports: !reset ["127.0.0.1:6379:6379"]
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 1280M

  rabbitmq:
    <<: *restart_unless_stopped
    ports: !reset ["127.0.0.1:5772:5672", "127.0.0.1:15772:15672"]
    deploy:
      resources:
        limits:
          memory: 768M

  control:
    <<: [*restart_unless_stopped, *ecr_control_image]
    ports: !reset ["127.0.0.1:8100:8000"]
    environment:
      DEBUG: ${DEBUG:-true}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-aimeshbackend.zeroshield.ai,aimeshfirewall.zeroshield.ai,localhost,127.0.0.1,control}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://aimeshfirewall.zeroshield.ai}
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-https://aimeshgateway.zeroshield.ai}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-https://aimeshbackend.zeroshield.ai}
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2048M

  gateway:
    <<: [*restart_unless_stopped, *ecr_gateway_image]
    ports: !reset ["127.0.0.1:8300:8300"]
    environment:
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-6}
      GUNICORN_WORKER_CONNECTIONS: ${GUNICORN_WORKER_CONNECTIONS:-2000}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      GUNICORN_KEEPALIVE: ${GUNICORN_KEEPALIVE:-65}
      GATEWAY_SCANNER_THREAD_POOL_SIZE: ${GATEWAY_SCANNER_THREAD_POOL_SIZE:-8}
      GATEWAY_BEDROCK_THREAD_POOL_SIZE: ${GATEWAY_BEDROCK_THREAD_POOL_SIZE:-24}
      GATEWAY_VAULT_POOL_MIN: ${GATEWAY_VAULT_POOL_MIN:-2}
      GATEWAY_VAULT_POOL_MAX: ${GATEWAY_VAULT_POOL_MAX:-16}
      GATEWAY_LAST_USED_DEBOUNCE_SECONDS: ${GATEWAY_LAST_USED_DEBOUNCE_SECONDS:-60}
      GATEWAY_REDIS_MAX_CONNECTIONS: ${GATEWAY_REDIS_MAX_CONNECTIONS:-300}
      GATEWAY_TIER2_CACHE_TTL_SECONDS: ${GATEWAY_TIER2_CACHE_TTL_SECONDS:-300}
      GATEWAY_TIER2_CACHE_MAX: ${GATEWAY_TIER2_CACHE_MAX:-10000}
      GATEWAY_TIER2_SAMPLE_RATE: ${GATEWAY_TIER2_SAMPLE_RATE:-1.0}
      ENABLE_TIER2: ${ENABLE_TIER2:-true}
      GATEWAY_RAG_ENABLED: ${GATEWAY_RAG_ENABLED:-true}
      CHROMA_URL: ""
      GATEWAY_TIER2_EXECUTION_MODE: ${GATEWAY_TIER2_EXECUTION_MODE:-sync_pre_llm}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://aimeshfirewall.zeroshield.ai}
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-https://aimeshgateway.zeroshield.ai}
      GATEWAY_CORS_ORIGINS: ${GATEWAY_CORS_ORIGINS:-https://aimeshfirewall.zeroshield.ai,https://aimeshbackend.zeroshield.ai}
    deploy:
      resources:
        limits:
          cpus: "6"
          memory: 9G

  workers:
    <<: [*restart_unless_stopped, *ecr_workers_image]
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M

  workers-beat:
    <<: [*restart_unless_stopped, *ecr_workers_image]
    deploy:
      resources:
        limits:
          memory: 512M

  mcp-stub:
    <<: *restart_unless_stopped
    profiles: ["mcp-stub"]

  frontend:
    profiles: ["dev-frontend"]

  nginx:
    <<: *restart_unless_stopped
    image: nginx:1.27-alpine
    pull_policy: always
    ports: !reset ["80:80"]
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      control: { condition: service_healthy }
      gateway: { condition: service_started }
    deploy:
      resources:
        limits:
          memory: 256M
