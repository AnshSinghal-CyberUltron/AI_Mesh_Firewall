# Production overlay — merge with base:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Public hosts (Route53 → EC2 / nginx :80/:443):
#   frontend  https://aimeshfirewall.zeroshield.ai
#   backend   https://aimeshbackend.zeroshield.ai
#   gateway   https://aimeshgateway.zeroshield.ai
#
# Sized for c8g.2xlarge (8 vCPU / 16 GiB): gateway-first. Gateway has NO CPU
# quota so it can use every idle core; memory ceiling 12 GiB (host 15 GiB minus
# postgres/redis/OS). WEB_CONCURRENCY default 16 = 2× vCPU for I/O-bound
# Bedrock/BYOK waits (research: I/O-bound uvicorn 2 workers/vCPU).
# Apps + migrations reach Postgres via pgbouncer:6432 only (never postgres:5432).
#
# Build/push: infra/scripts/build-push-images.sh  |  Deploy: scripts/deploy-ec2.sh
#
# This overlay covers EVERY service defined in docker-compose.yml:
#   always-on: postgres, pgbouncer, redis, rabbitmq, control, gateway, workers,
#              workers-beat, mcp-sandbox-image, mcp-broker, guardrails,
#              vector-retrieval, nginx, demo
#   profile:   chromadb (chroma), mongo (telemetry-pilot), mcp-stub (mcp-stub),
#              frontend (dev-frontend), transport stubs (transport-stubs),
#              postgres-exporter (observability)
# Dev-only services stay profile-gated; prod defaults enable the full product path
# (MCP sandboxes + Celery + guardrails/vector sidecars) without requiring --profile.

name: ai_mesh_firewall

x-restart: &restart_unless_stopped
  restart: unless-stopped

x-ecr-gateway: &ecr_gateway_image
  image: ${ECR_REGISTRY:?set ECR_REGISTRY}/ai-mesh-gateway:${IMAGE_TAG:-latest}
  pull_policy: always
  build: !reset null

x-ecr-control: &ecr_control_image
  image: ${ECR_REGISTRY:?set ECR_REGISTRY}/ai-mesh-control:${IMAGE_TAG:-latest}
  pull_policy: always
  build: !reset null

x-ecr-workers: &ecr_workers_image
  image: ${ECR_REGISTRY:?set ECR_REGISTRY}/ai-mesh-workers:${IMAGE_TAG:-latest}
  pull_policy: always
  build: !reset null

x-ecr-nginx: &ecr_nginx_image
  image: ${ECR_REGISTRY:?set ECR_REGISTRY}/ai-mesh-nginx:${IMAGE_TAG:-latest}
  pull_policy: always
  build: !reset null

x-ecr-mcp-broker: &ecr_mcp_broker_image
  image: ${ECR_REGISTRY:?set ECR_REGISTRY}/ai-mesh-mcp-broker:${IMAGE_TAG:-latest}
  pull_policy: always
  build: !reset null

x-ecr-mcp-sandbox: &ecr_mcp_sandbox_image
  image: ${ECR_REGISTRY:?set ECR_REGISTRY}/ai-mesh-mcp-sandbox:${IMAGE_TAG:-latest}
  pull_policy: always
  build: !reset null

services:
  # ── Infrastructure ──────────────────────────────────────────────────────────
  postgres:
    <<: *restart_unless_stopped
    ports: !override ["127.0.0.1:5432:5432"]
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      # Align with base compose / PERF-0006. PgBouncer caps server-side fan-in
      # (max_db_connections≈80); 400 is the hard ceiling for direct + pooler.
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-400}
      - -c
      - work_mem=4MB
    deploy:
      resources:
        limits:
          memory: 2560M

  pgbouncer:
    <<: *restart_unless_stopped
    ports: !override ["127.0.0.1:6432:6432"]
    environment:
      # Keep server pool well under POSTGRES_MAX_CONNECTIONS=400.
      MAX_DB_CONNECTIONS: ${PGBOUNCER_MAX_DB_CONNECTIONS:-80}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-25}
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-1000}
    deploy:
      resources:
        limits:
          memory: 256M

  redis:
    <<: *restart_unless_stopped
    ports: !override ["127.0.0.1:6379:6379"]
    command: redis-server --appendonly yes --maxmemory 768mb --maxmemory-policy allkeys-lru --timeout 0 --tcp-keepalive 60
    deploy:
      resources:
        limits:
          memory: 1024M

  rabbitmq:
    <<: *restart_unless_stopped
    ports: !override ["127.0.0.1:5772:5672", "127.0.0.1:15772:15672"]
    deploy:
      resources:
        limits:
          memory: 512M

  chromadb:
    <<: *restart_unless_stopped
    # Still behind --profile chroma (BYOK vector is default; local Chroma optional).
    ports: !override ["127.0.0.1:8001:8000"]
    deploy:
      resources:
        limits:
          memory: 1024M

  mongo:
    <<: *restart_unless_stopped
    # Still behind --profile telemetry-pilot.
    ports: !override ["127.0.0.1:27017:27017"]
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Control plane ───────────────────────────────────────────────────────────
  control:
    <<: [*restart_unless_stopped, *ecr_control_image]
    build: !reset null
    ports: !override ["127.0.0.1:8100:8000"]
    # Do NOT override command — image CMD is server-entrypoint.sh (cgroup-aware
    # worker count). Pin via CONTROL_WEB_CONCURRENCY (2 fits the 2-CPU limit).
    environment:
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CONTROL_WEB_CONCURRENCY: ${CONTROL_WEB_CONCURRENCY:-2}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-aimeshbackend.zeroshield.ai,aimeshfirewall.zeroshield.ai,aimeshgateway.zeroshield.ai,localhost,127.0.0.1,control,gateway}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://aimeshfirewall.zeroshield.ai}
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-https://aimeshgateway.zeroshield.ai}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-https://aimeshbackend.zeroshield.ai}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://aimeshfirewall.zeroshield.ai,https://aimeshbackend.zeroshield.ai,https://aimeshgateway.zeroshield.ai}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://aimeshfirewall.zeroshield.ai,https://aimeshbackend.zeroshield.ai,https://aimeshgateway.zeroshield.ai}
      SIMULATOR_DEFAULTS_ENABLED: ${SIMULATOR_DEFAULTS_ENABLED:-true}
      CHANNEL_LAYERS_REDIS_URL: redis://redis:6379/1
      ASGI_ALLOWED_ORIGINS: ${ASGI_ALLOWED_ORIGINS:-https://aimeshfirewall.zeroshield.ai,https://aimeshbackend.zeroshield.ai,https://aimeshgateway.zeroshield.ai}
      # Internal Docker DNS — nginx terminates TLS; control→gateway stays HTTP.
      GATEWAY_URL: http://gateway:8300
      GATEWAY_INTERNAL_API_KEY: ${GATEWAY_INTERNAL_API_KEY:-}
      TIER2_PROVIDER: ${TIER2_PROVIDER:-bedrock}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      VERTEX_TIER2_MODEL: ${VERTEX_TIER2_MODEL:-gemini-3.5-flash-lite}
      # Transaction pooling: never keep idle server conns behind PgBouncer.
      POSTGRES_CONN_MAX_AGE: ${POSTGRES_CONN_MAX_AGE:-0}
      DISABLE_SERVER_SIDE_CURSORS: ${DISABLE_SERVER_SIDE_CURSORS:-true}
      DJANGO_CACHE_MAX_CONNECTIONS: ${DJANGO_CACHE_MAX_CONNECTIONS:-50}
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2560M

  # ── Gateway ─────────────────────────────────────────────────────────────────
  gateway:
    <<: [*restart_unless_stopped, *ecr_gateway_image]
    build: !reset null
    # Bind 8300 on host for Prometheus scrape (auth: METRICS_SCRAPER_KEY on /metrics)
    ports: !override ["0.0.0.0:8300:8300"]
    environment:
      # 2× vCPU for I/O-bound 9-stage (Bedrock + BYOK waits). Pin to 8 if RSS climbs.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-16}
      GATEWAY_CIRCUIT_BREAKER_ENABLED: ${GATEWAY_CIRCUIT_BREAKER_ENABLED:-true}
      TIER2_BREAKER_MIN_CALLS: ${TIER2_BREAKER_MIN_CALLS:-5}
      TIER2_BREAKER_FAILURE_THRESHOLD: ${TIER2_BREAKER_FAILURE_THRESHOLD:-0.5}
      TIER2_BREAKER_COOLDOWN_SECONDS: ${TIER2_BREAKER_COOLDOWN_SECONDS:-30}
      GUNICORN_WORKER_CONNECTIONS: ${GUNICORN_WORKER_CONNECTIONS:-20000}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      GUNICORN_KEEPALIVE: ${GUNICORN_KEEPALIVE:-65}
      # Thread pools are per forked worker. Leave GATEWAY_BEDROCK_THREAD_POOL_SIZE
      # unset so entrypoint.sh exports detector bedrock_pool (nofile/workers).
      # Unset → entrypoint detector (scanner=cpu, redis_pool=asgi*4).
      GATEWAY_LAST_USED_DEBOUNCE_SECONDS: ${GATEWAY_LAST_USED_DEBOUNCE_SECONDS:-60}
      GATEWAY_TIER2_CACHE_TTL_SECONDS: ${GATEWAY_TIER2_CACHE_TTL_SECONDS:-0}
      GATEWAY_TIER2_CACHE_MAX: ${GATEWAY_TIER2_CACHE_MAX:-3000}
      GATEWAY_TIER2_SAMPLE_RATE: ${GATEWAY_TIER2_SAMPLE_RATE:-1.0}
      ENABLE_TIER2: ${ENABLE_TIER2:-true}
      TIER2_PROVIDER: ${TIER2_PROVIDER:-bedrock}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      VERTEX_TIER2_MODEL: ${VERTEX_TIER2_MODEL:-gemini-3.5-flash-lite}
      # Empty = T2 scanner model (Haiku). Nova Micro is optional; this account
      # rejects it on-demand. T2 scanner stays BEDROCK_TIER2_SCANNER_MODEL.
      GATEWAY_RAG_ENABLED: ${GATEWAY_RAG_ENABLED:-true}
      CHROMA_URL: ${CHROMA_URL:-}
      GATEWAY_TIER2_EXECUTION_MODE: ${GATEWAY_TIER2_EXECUTION_MODE:-sync_pre_llm}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://aimeshfirewall.zeroshield.ai}
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-https://aimeshgateway.zeroshield.ai}
      # Browser clients may call the dedicated gateway host or the UI/backend origins.
      GATEWAY_CORS_ORIGINS: ${GATEWAY_CORS_ORIGINS:-https://aimeshfirewall.zeroshield.ai,https://aimeshbackend.zeroshield.ai,https://aimeshgateway.zeroshield.ai}
      GATEWAY_LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-INFO}
      AI_MESH_CONTROL_URL: http://control:8000
      AIGUARDX_BACKEND_URL: http://control:8000
      # Internal control/LLM URLs are http:// — keep allow flag for Docker DNS only.
      GATEWAY_ALLOW_HTTP: ${GATEWAY_ALLOW_HTTP:-1}
      GATEWAY_INTERNAL_API_KEY: ${GATEWAY_INTERNAL_API_KEY:-}
      METRICS_SCRAPER_KEY: ${METRICS_SCRAPER_KEY:-}
      METRICS_ALLOW_OPEN: ${METRICS_ALLOW_OPEN:-false}
      GUARDRAILS_SERVICE_URL: http://guardrails:8310
      VECTOR_SERVICE_URL: http://vector-retrieval:8312
      MCP_BROKER_URL: http://mcp-broker:8311
      MCP_BROKER_INTERNAL_KEY: ${MCP_BROKER_INTERNAL_KEY:-}
      MCP_STDIO_IN_PROCESS: ${MCP_STDIO_IN_PROCESS:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8300/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 60s
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          # No CPU quota — CFS shares the 8 host cores; gateway takes idle.
          memory: 12288M

  # ── Celery (always-on in prod — clear base `workers` profile) ───────────────
  workers:
    <<: [*restart_unless_stopped, *ecr_workers_image]
    build: !reset null
    profiles: !reset null
    command:
      [
        "celery",
        "-A",
        "ai_mesh_workers.celery_app",
        "worker",
        "-Q",
        "policy.compile,platform.batch,compute.heavy,scan.tier2,vector.index,mcp.audit",
        "--loglevel=info",
        "--concurrency=${CELERY_WORKER_CONCURRENCY:-2}",
      ]
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1280M

  workers-beat:
    <<: [*restart_unless_stopped, *ecr_workers_image]
    build: !reset null
    profiles: !reset null
    deploy:
      resources:
        limits:
          memory: 384M

  # ── MCP sidecars (always-on in prod — clear base `services` profile) ────────
  guardrails:
    <<: *restart_unless_stopped
    profiles: !reset null
    ports: !override ["127.0.0.1:8310:8310"]
    deploy:
      resources:
        limits:
          memory: 256M

  vector-retrieval:
    <<: *restart_unless_stopped
    profiles: !reset null
    ports: !override ["127.0.0.1:8312:8312"]
    deploy:
      resources:
        limits:
          memory: 256M

  mcp-sandbox-image:
    <<: [*restart_unless_stopped, *ecr_mcp_sandbox_image]
    build: !reset null
    profiles: !reset null
    # One-shot pull of the sandbox image so the broker can spawn per-org containers.
    # restart is ignored for command:["true"] from base; keep pull_policy always.
    restart: "no"

  mcp-broker:
    <<: [*restart_unless_stopped, *ecr_mcp_broker_image]
    build: !reset null
    profiles: !reset null
    ports: !override ["127.0.0.1:8311:8311"]
    environment:
      MCP_BROKER_INTERNAL_KEY: ${MCP_BROKER_INTERNAL_KEY:-}
      MCP_SANDBOX_IMAGE: ${ECR_REGISTRY:?set ECR_REGISTRY}/ai-mesh-mcp-sandbox:${IMAGE_TAG:-latest}
      MCP_SANDBOX_NETWORK: mcp_sandbox_bridge
      MCP_SANDBOX_IDLE_TIMEOUT: ${MCP_SANDBOX_IDLE_TIMEOUT:-3600}
      MCP_SANDBOX_RUNTIME: ${MCP_SANDBOX_RUNTIME:-runsc}
      MCP_SANDBOX_RUNTIME_REQUIRED: ${MCP_SANDBOX_RUNTIME_REQUIRED:-false}
      MCP_SANDBOX_MEMORY_MB: ${MCP_SANDBOX_MEMORY_MB:-2048}
      MCP_SANDBOX_NODE_MAX_OLD_SPACE_MB: ${MCP_SANDBOX_NODE_MAX_OLD_SPACE_MB:-0}
      MCP_SANDBOX_NPM_CACHE_SIZE_MB: ${MCP_SANDBOX_NPM_CACHE_SIZE_MB:-1024}
      MCP_BROKER_CONTAINER_NAME: ai_mesh_mcp_broker
    deploy:
      resources:
        limits:
          memory: 768M

  # ── Dev / optional (stay profile-gated) ─────────────────────────────────────
  mcp-stub:
    <<: *restart_unless_stopped
    profiles: ["mcp-stub"]
    ports: !override ["127.0.0.1:9999:9999"]

  frontend:
    # Production UI is baked into nginx (ai-mesh-nginx). Vite only for debugging.
    profiles: ["dev-frontend"]

  http-everything:
    profiles: ["transport-stubs"]

  sse-everything:
    profiles: ["transport-stubs"]

  ws-everything:
    profiles: ["transport-stubs"]

  # ── Edge + demo ─────────────────────────────────────────────────────────────
  # OpenAI-SDK reference demo at /demo/ (HTTP + HTTPS). In-app login uses the same
  # control credentials as the console; each session provisions that org's
  # simulator gateway key. nginx does NOT depend_on demo (lazy DNS) so a missing
  # demo only 502s /demo/ — console + gateway stay up.
  demo:
    <<: *restart_unless_stopped
    image: ${ECR_REGISTRY:?set ECR_REGISTRY}/ai-mesh-demo:${IMAGE_TAG:-latest}
    pull_policy: always
    build: !reset null
    expose: ["8770"]
    environment:
      CONTROL_BASE_URL: ${DEMO_CONTROL_BASE_URL:-http://control:8000}
      ZEROSHIELD_BASE_URL: ${DEMO_GATEWAY_BASE_URL:-http://gateway:8300/v1}
      # Optional fallback only (unused when users log in):
      ZEROSHIELD_API_KEY: ${DEMO_GATEWAY_KEY:-}
      RAG_COLLECTION: ${RAG_COLLECTION:-zeroshield-rag-e2e}
    depends_on:
      control: { condition: service_started }
      gateway: { condition: service_started }
    deploy:
      resources:
        limits:
          memory: 256M

  nginx:
    <<: [*restart_unless_stopped, *ecr_nginx_image]
    build: !reset null
    ports: ["80:80", "443:443"]
    # nginx config (deploy/nginx.conf + nginx-ssl.conf) is BAKED into the image
    # via deploy/Dockerfile.nginx and rebuilt on every deploy. No bind-mount:
    # a mounted box-file would SHADOW the baked config with a stale copy
    # (sync-to-ec2.sh does not ship deploy/*.conf), silently dropping config
    # changes. The image is the single source of truth.
    # server_name blocks: aimeshfirewall / aimeshbackend / aimeshgateway .zeroshield.ai
    depends_on:
      control: { condition: service_healthy }
      gateway: { condition: service_started }
    deploy:
      resources:
        limits:
          memory: 256M

  # Optional: scrape with --profile observability (see deploy/observability/).
  postgres-exporter:
    <<: *restart_unless_stopped
    profiles: ["observability"]
    image: prometheuscommunity/postgres-exporter:v0.15.0
    ports: ["127.0.0.1:9187:9187"]
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-ai_mesh_firewall}:${POSTGRES_PASSWORD:-ai_mesh_firewall}@postgres:5432/${POSTGRES_DB:-ai_mesh_firewall}?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 128M
