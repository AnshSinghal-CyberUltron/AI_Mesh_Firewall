[project]
name = "gateway"
version = "0.1.0"
description = "ZeroShield Data Plane — FastAPI proxy with security scanning and LiteLLM routing"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34.0",
    "cryptography>=43.0.0",
    "fastapi>=0.104.0",
    "gunicorn>=22.0",
    "httpx>=0.25.0",
    "jsonschema>=4.20.0",
    "litellm>=1.30.0",
    "numpy>=1.26.0",
    "pinecone>=5.0.0",
    "psutil>=5.9.0",
    "psycopg[binary,pool]>=3.2.0",
    "pymilvus>=2.3.0",
    # Phase 1 F-3.1: ChromaDB HTTP client for the RAG Collection Manager.
    "chromadb>=0.5.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "redis>=5.0.0",
    "requests>=2.31.0",
    "motor>=3.5.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "prometheus-client>=0.20.0",
    # Multi-pattern prefilter for patterns.py (task 7). The code has ALWAYS been written
    # to no-op when this wheel is absent — and it was absent, so the prefilter never ran
    # and its gate never exercised the path it exists to check.
    # MEASURED with it present, unique 4096-char input: redact_all 4.88 -> 2.67 ms (1.83x).
    # (The 7.4x in _build_prefilter's docstring is NOT what the end-to-end function does.)
    # Soundness: scripts/detection/hyperscan_prefilter_gate.py, 762 inputs, 0 under-reports;
    # 56 patterns compile, 7 with zero-width assertions are rejected and stay on `re`.
    "hyperscan>=0.7.0; platform_machine == 'x86_64'",
    "aiobotocore>=3.9.0",
    "google-genai>=2.23.0",
]

[project.optional-dependencies]
# openai is PINNED EXACTLY: the conformance harness (tests/test_openai_sdk_compat.py)
# is the executable definition of "exact OpenAI-SDK compatibility", so the SDK version
# it validates against is part of the contract. Bump deliberately + re-run the suite.
dev = ["pytest>=8", "pytest-asyncio>=0.24", "fakeredis>=2", "openai==2.38.0", "httpx>=0.25.0", "docker>=7.0.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["ai_mesh_gateway", "../shared"]
markers = [
    "docker: integration tests requiring a local Docker daemon",
]
