[project]
name = "gateway"
version = "0.1.0"
description = "ZeroShield Data Plane — FastAPI proxy with security scanning and LiteLLM routing"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34.0",
    "cryptography>=43.0.0",
    "fastapi>=0.104.0",
    "gunicorn>=22.0",
    "httpx>=0.25.0",
    "jsonschema>=4.20.0",
    "litellm>=1.30.0",
    "numpy>=1.26.0",
    "pinecone>=5.0.0",
    "psutil>=5.9.0",
    "psycopg[binary,pool]>=3.2.0",
    "pymilvus>=2.3.0",
    # Phase 1 F-3.1: ChromaDB HTTP client for the RAG Collection Manager.
    "chromadb>=0.5.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "redis>=5.0.0",
    "requests>=2.31.0",
    "motor>=3.5.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "fakeredis>=2"]
