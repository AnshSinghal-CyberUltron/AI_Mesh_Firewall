# LiteLLM Router Configuration for ZeroShield Gateway
#
# IMPORTANT: model_name values here must match the names stored in
# GatewayAPIKey.allowed_models in Redis (set via Control Plane).
# If a client requests model "gpt-4o", this file must have a
# model_name: "gpt-4o" entry.
#
# API keys use os.environ/ prefix -- LiteLLM resolves these at runtime
# from your environment variables.
#
# AWS Bedrock models use IAM credentials from the environment:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION_NAME

model_list:

  # ═══════════════════════════════════════════════════════════
