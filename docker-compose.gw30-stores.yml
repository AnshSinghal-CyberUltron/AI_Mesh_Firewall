# GW30 local vector-store backends for the L30-1/L30-2/L30-3 live acceptance gates.
# These are DEV-MODE, single-node, auth-disabled store servers used only to drive the
# real per-store Vector_Transport implementations against live wire bytes. Not for prod.
# Ports are chosen in a clean 69xx range to avoid the running ai_mesh_firewall stack.
# Memory: with the main stack and every store here (both JVMs at a 512m heap) a 14 GiB host
# keeps about 3.6 GiB available (measured 3 Nov 2026). Headroom is thin, but it runs.
name: gw30-stores

services:
  gw30-qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6933:6333"   # REST
      - "6934:6334"   # gRPC
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  gw30-weaviate:
    image: semitechnologies/weaviate:1.27.0
    command: ["--host", "0.0.0.0", "--port", "8080", "--scheme", "http"]
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: ""
      QUERY_DEFAULTS_LIMIT: "25"
      CLUSTER_HOSTNAME: "node1"
      GRPC_PORT: "50051"
    ports:
      - "6980:8080"
      - "6951:50051"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/v1/.well-known/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  gw30-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: "single-node"
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "false"
    ports:
      - "6920:9200"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 8s
      timeout: 5s
      retries: 40

  # OpenSearch stands in for the aws_opensearch_serverless connector (same knn_vector API).
  gw30-opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: "single-node"
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:6921:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 8s
      timeout: 5s
      retries: 40

  gw30-chroma:
    image: chromadb/chroma:0.5.20
    ports:
      - "6900:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:8000/api/v1/heartbeat || curl -s http://127.0.0.1:8000/api/v2/heartbeat || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  gw30-mongo-atlas:
    image: mongodb/mongodb-atlas-local:latest
    ports:
      - "6927:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' || exit 1"]
      interval: 8s
      timeout: 5s
      retries: 40

  # Redis with the search module: the Redis transport needs FT.CREATE / FT.SEARCH (server-side
  # KNN). Its own port, so the live gate never writes to the main stack's state Redis on 6379.
  gw30-redis-stack:
    image: redis/redis-stack-server:7.4.0-v1
    ports:
      - "6979:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  # pgvector for the live gate, separate from the main stack's ai_mesh_firewall database.
  gw30-pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gw30
      POSTGRES_PASSWORD: gw30
      POSTGRES_DB: gw30
    ports:
      - "6932:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gw30 -d gw30"]
      interval: 5s
      timeout: 3s
      retries: 20
