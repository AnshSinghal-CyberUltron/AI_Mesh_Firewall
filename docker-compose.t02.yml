# T02 staging overlay. Recorder OpenAI port is internal-only.
# Admin/fault is bound to 127.0.0.1 on the host — not on public :8180/:8300.

services:
  t02-recorder:
    build:
      context: .
      dockerfile: staging/t02/Dockerfile.recorder
    image: ai-mesh-t02-recorder:t02
    environment:
      T02_RECORDER_KEY: ${T02_RECORDER_KEY:?T02_RECORDER_KEY required}
      T02_ADMIN_TOKEN: ${T02_ADMIN_TOKEN:?T02_ADMIN_TOKEN required}
    expose:
      - "8080"
    ports:
      - "127.0.0.1:18081:18081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 8
      start_period: 5s
    restart: unless-stopped

  gateway:
    environment:
      GATEWAY_ALLOW_HTTP_LLM: "1"
      GATEWAY_LOADTEST_STUB_LLM: "0"
    depends_on:
      t02-recorder:
        condition: service_healthy
