# Integration-stack override (project name: amfint). Ports are 127.0.0.1 and +30000 from the base
# compose, so they collide with neither the main stack (:28xxx, project ai_mesh_firewall) nor :8180.
# Flags are enabled for the TEST ORG ONLY (zeroshield / dev-org). Never "*".
# AMF_AUDIT_RETENTION_SWEEP is deliberately NOT set (default off).
services:
  postgres:   { ports: !override ["127.0.0.1:35432:5432"] }
  pgbouncer:  { ports: !override ["127.0.0.1:36432:6432"] }
  redis:      { ports: !override ["127.0.0.1:36379:6379"] }
  chromadb:   { ports: !override ["127.0.0.1:38001:8000"] }
  rabbitmq:   { ports: !override ["127.0.0.1:35672:5672", "127.0.0.1:45672:15672"] }
  mongo:      { ports: !override ["127.0.0.1:57017:27017"] }
  control:
    ports: !override ["127.0.0.1:38100:8000"]
    environment:
      VECTOR_PROVIDER_ALLOW_PRIVATE: "1"
      MCP_ALLOW_INTERNAL_HOSTS: "fake-mcp:9500,127.0.0.1:9500"
      AMF_V2_AUDIT_ORG_MAP: "dev-org=zeroshield,_unauthenticated=zeroshield"
      V2_PLAN_CONTROLS_ENABLED: "true"
      V2_PLAN_CONTROLS_ORGS: "zeroshield,dev-org"
      V2_PLAN_NEW_RULES_MODE: "enforce"
      V2_CANARY_ORGS: "${INT_CANARY_ORGS-zeroshield,dev-org}"
      V2_EXFIL_ORGS: "${INT_EXFIL_ORGS-}"
      V2_REWRITE_ORGS: "zeroshield,dev-org"
      ASGI_ALLOWED_ORIGINS: "http://127.0.0.1:38180,http://localhost:38180"
      FRONTEND_ORIGIN: "http://127.0.0.1:38180"
      GATEWAY_PUBLIC_URL: "http://127.0.0.1:38180"
      BACKEND_PUBLIC_URL: "http://127.0.0.1:38180"
  gateway:    { ports: !override ["127.0.0.1:38300:8300"] }
  gateway-v2:
    ports: !override ["127.0.0.1:38301:8301"]
    environment:
      AMF_DEV_MCP_ALLOW_INTERNAL_HOSTS: fake-mcp,127.0.0.1:9500,127.0.0.1
      AMF_DEV_CONTROL_URL: http://127.0.0.1:8000
      AMF_MCP_ALLOW_PLAINTEXT_CREDENTIAL_HOSTS: fake-mcp
      AMF_DEV_PROVIDER_URL: ${INT_PROVIDER_URL-}
      AMF_DEV_PROVIDER_API_KEY: ${INT_PROVIDER_KEY-}
    volumes:
      - ./docs/plans/evidence/2026-11-04-integration/loopback_fwd.py:/opt/loopback_fwd.py:ro
    command: ["sh", "-c", "python /opt/loopback_fwd.py & exec python -m gateway_v2.edge.serve"]
  guardrails: { ports: !override ["127.0.0.1:38310:8310"] }
  mcp-broker:
    container_name: amfint_mcp_broker
    environment:
      MCP_BROKER_CONTAINER_NAME: amfint_mcp_broker
      MCP_AGENT_ALLOW_INTERNAL_HOSTS: fake-mcp
    ports: !override ["127.0.0.1:38311:8311"]
    volumes:
      - ${XDG_RUNTIME_DIR}/docker.sock:/var/run/docker.sock
  mcp-stub:   { ports: !override ["127.0.0.1:39999:9999"] }
  vector-retrieval: { ports: !override ["127.0.0.1:38312:8312"] }
  demo:       { ports: !override ["127.0.0.1:38770:8770"] }
  frontend:
    ports: !override ["127.0.0.1:38180:5173"]
    environment:
      VITE_GATEWAY_BASE_URL: http://127.0.0.1:38180
      VITE_BACKEND_BASE_URL: http://127.0.0.1:38180
