# zeroshield.ai production vhosts (all DNS → same EC2).
# TLS: terminate at ALB/CloudFront or add certbot + listen 443 blocks.

# PERF: compress text assets. The SPA JS bundle is ~1.77MB uncompressed; gzip
# cuts the cold-load transfer ~3.7x (→~475KB). conf.d/*.conf is included inside
# the http{} context, so these http-level directives apply to every vhost below.
# (The base image ships gzip COMMENTED OUT with a html-only default gzip_types,
# so JS/CSS/JSON were served raw until this block.)
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types application/javascript application/x-javascript text/javascript text/css text/plain text/xml application/xml application/json image/svg+xml application/wasm font/ttf font/otf application/vnd.ms-fontobject;

# Hide the nginx patch version from Server (CWE-200). The token "nginx" remains;
# alpine nginx cannot omit the header without headers-more.
server_tokens off;

# SECURITY headers (defense-in-depth, applied http-wide to every vhost in this
# and 02-ssl.conf). nginx add_header is NOT inherited once a block defines its
# own add_header, so every location that sets Cache-Control / X-Request-ID must
# re-include this snippet. HSTS uses a conservative max-age without
# includeSubDomains so sibling subdomains are unaffected; CSP is
# frame-ancestors-only to stop clickjacking without risking the SPA's hashed
# assets. (Cloudflare edge min-TLS 1.2 is a separate dashboard toggle — not
# settable from origin nginx.)
include /etc/nginx/security-headers.inc;

# CWE-319: treat a request as edge-HTTPS only when it comes from a private
# hop (ALB / docker / loopback) AND X-Forwarded-Proto is https. Public clients
# hitting the EIP on :80 cannot spoof this (their $remote_addr is not RFC1918).
# ALB health checks use Host=<IP> → default_server, which does NOT include
# require-edge-https.inc.
geo $is_trusted_proxy {
    default          0;
    10.0.0.0/8       1;
    172.16.0.0/12    1;
    192.168.0.0/16   1;
    127.0.0.0/8      1;
    # GCP HTTPS/HTTP(S) load balancer → backend (not RFC1918). Without these,
    # origin :80 301-loops to https://$host because $remote_addr is 35.191.x.
    130.211.0.0/22   1;
    35.191.0.0/16    1;
}
map $http_x_forwarded_proto $proto_is_https {
    default          0;
    https            1;
    "~*^https\\b"    1;
}
# Concatenation is 11 only for trusted hop + proto https (ALB).
map "$is_trusted_proxy$proto_is_https" $is_edge_https {
    default          0;
    11               1;
}
map "$is_edge_https:$request_method" $cleartext_https_redirect {
    default          "";
    "0:GET"          "https";
    "0:HEAD"         "https";
    "0:POST"         "deny";
    "0:PUT"          "deny";
    "0:PATCH"        "deny";
    "0:DELETE"       "deny";
    "0:OPTIONS"      "deny";
}

# The Django control plane sets its OWN X-Frame-Options/X-Content-Type-Options/
# Referrer-Policy on /api responses. Without stripping them, proxied responses
# carry BOTH nginx's and Django's copies — duplicated headers and a CONFLICTING
# Referrer-Policy (same-origin vs strict-origin-when-cross-origin). Hide the
# upstream copies so the nginx set above is the single source of truth. (No-op
# for gateway-proxied responses, which set none of these.)
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;

# ── aimeshfirewall.zeroshield.ai — React UI + /api proxy (SPA uses relative /api/*) ──
server {
    listen 80;
    server_name aimeshfirewall.zeroshield.ai;
    client_max_body_size 64m;
    include /etc/nginx/edge-error.inc;
    include /etc/nginx/require-edge-https.inc;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Lazy Docker DNS: a control recreate must not 502 /api (incl. /auth/token)
        # to a stale container IP pinned at nginx start. Same pattern as /v1/.
        resolver 127.0.0.53 ipv6=off valid=30s;
        set $control_upstream "control:8000";
        proxy_pass http://$control_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location /ws/ {
        resolver 127.0.0.53 ipv6=off valid=30s;
        set $control_upstream "control:8000";
        proxy_pass http://$control_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
    }

    # Same-origin gateway proxy (avoids cross-origin CORS to aimeshgateway.*)
    location /v1/ {
        # Lazy Docker DNS (same pattern as /demo/) so a gateway recreate does not
        # 502 to a stale container IP pinned at nginx start.
        resolver 127.0.0.53 ipv6=off valid=30s;
        set $gateway_upstream "gateway:8300";
        proxy_pass http://$gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
        chunked_transfer_encoding on;
    }

    location /gateway/ {
        resolver 127.0.0.53 ipv6=off valid=30s;
        set $gateway_upstream "gateway:8300";
        proxy_pass http://$gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 360s;
    }

    location = /gw-health {
        resolver 127.0.0.53 ipv6=off valid=30s;
        set $gateway_health "gateway:8300";
        proxy_pass http://$gateway_health/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # ── OpenAI-SDK reference demo (in-app console login) ───────────────────────
    # App-level auth: same email/password as /login, scoped to the user's org.
    # CRITICAL (anti-outage): address demo via a *variable* + Docker DNS resolver
    # so a missing/down demo container only 502s /demo/ — never crash-loops nginx.
    location = /demo { return 301 /demo/; }
    location /demo/ {
        resolver 127.0.0.53 ipv6=off valid=30s;
        set $demo_upstream "demo:8770";
        rewrite ^/demo/(.*)$ /$1 break;
        proxy_pass http://$demo_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Authorization $http_authorization;
        # Streaming chat (SSE-style) must not be buffered.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
        chunked_transfer_encoding on;
    }

    location /assets/ {
        # PERF: fingerprinted (content-hashed) build assets are immutable — cache
        # 1 year in the browser AND at the Cloudflare edge so repeat visits skip
        # the ~475KB JS bundle entirely. (Cloudflare's default Browser Cache TTL
        # was overriding to 4h; an explicit immutable header is respected.)
        expires 1y;
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        # index.html must NEVER be cached: it carries the reference to the
        # content-hashed JS/CSS bundle. If a browser/edge serves a stale
        # index.html after a deploy, the user keeps running OLD JS (e.g. missing
        # the scan-detail pipeline fetch) even though the new bundle is live.
        # no-store + must-revalidate forces a fresh fetch of index.html on every
        # navigation so new deploys propagate without a manual hard-refresh.
        # Re-include security headers: this add_header would otherwise drop the
        # http-level CSP/HSTS/XFO set (live /login was shipping Cache-Control only).
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}

# ── aimeshbackend.zeroshield.ai — Django control /api ──
server {
    listen 80;
    server_name aimeshbackend.zeroshield.ai;
    client_max_body_size 64m;
    include /etc/nginx/edge-error.inc;
    include /etc/nginx/require-edge-https.inc;

    location / {
        resolver 127.0.0.53 ipv6=off valid=30s;
        set $control_upstream "control:8000";
        proxy_pass http://$control_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location /ws/ {
        resolver 127.0.0.53 ipv6=off valid=30s;
        set $control_upstream "control:8000";
        proxy_pass http://$control_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
    }
}

# ── aimeshgateway.zeroshield.ai — inference gateway (OpenAI-compatible) ──
server {
    listen 80;
    server_name aimeshgateway.zeroshield.ai;
    client_max_body_size 64m;
    include /etc/nginx/edge-error.inc;
    include /etc/nginx/require-edge-https.inc;
    include /etc/nginx/deny-public-openapi.inc;

    location = /metrics {
        resolver 127.0.0.53 ipv6=off valid=30s;
        set $gateway_metrics "gateway:8300";
        proxy_pass http://$gateway_metrics/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Metrics-Scraper-Key $http_x_metrics_scraper_key;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        resolver 127.0.0.53 ipv6=off valid=30s;
        set $gateway_upstream "gateway:8300";
        proxy_pass http://$gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
        chunked_transfer_encoding on;
    }
}

# Fallback: unknown Host / direct IP — do not serve the SPA (CWE-1021 Host
# isolation). ALB health checks typically send Host=<target IP>; keep common
# probe paths 200 so a 403 on /login cannot take the instance out of rotation.
# Named vhosts (Host: aimeshfirewall.zeroshield.ai) are unchanged.
server {
    listen 80 default_server;
    server_name _;
    include /etc/nginx/edge-error.inc;
    default_type text/plain;

    location = / {
        include /etc/nginx/security-headers.inc;
        return 200 "ok\n";
    }
    location = /healthz {
        include /etc/nginx/security-headers.inc;
        return 200 "ok\n";
    }
    location = /health {
        include /etc/nginx/security-headers.inc;
        return 200 "ok\n";
    }
    location = /health/ {
        include /etc/nginx/security-headers.inc;
        return 200 "ok\n";
    }
    location = /gw-health {
        include /etc/nginx/security-headers.inc;
        return 200 "ok\n";
    }
    location / {
        return 403;
    }
}
