# HTTPS for Cloudflare "Full" mode (self-signed origin cert in /etc/nginx/ssl/).
# Cloudflare SSL must be "Full" (not "Full strict") OR use a Cloudflare Origin Certificate.

ssl_certificate     /etc/nginx/ssl/origin.crt;
ssl_certificate_key /etc/nginx/ssl/origin.key;

server {
    listen 443 ssl;
    http2 on;
    server_name aimeshfirewall.zeroshield.ai;
    client_max_body_size 64m;
    include /etc/nginx/edge-error.inc;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        resolver 127.0.0.53 ipv6=off valid=30s;
        set $control_upstream "control:8000";
        proxy_pass http://$control_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location /ws/ {
        resolver 127.0.0.53 ipv6=off valid=30s;
        set $control_upstream "control:8000";
        proxy_pass http://$control_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /v1/ {
        resolver 127.0.0.53 ipv6=off valid=30s;
        set $gateway_upstream "gateway:8300";
        proxy_pass http://$gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        proxy_cache off;
        proxy_read_timeout 360s;
        chunked_transfer_encoding on;
    }

    location /gateway/ {
        resolver 127.0.0.53 ipv6=off valid=30s;
        set $gateway_upstream "gateway:8300";
        proxy_pass http://$gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        proxy_read_timeout 360s;
    }

    location = /gw-health {
        resolver 127.0.0.53 ipv6=off valid=30s;
        set $gateway_health "gateway:8300";
        proxy_pass http://$gateway_health/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenAI-SDK demo (parity with deploy/nginx.conf HTTP vhost).
    # Lazy DNS: missing demo container → /demo/ 502 only; SPA stays up.
    location = /demo { return 301 /demo/; }
    location /demo/ {
        resolver 127.0.0.53 ipv6=off valid=30s;
        set $demo_upstream "demo:8770";
        rewrite ^/demo/(.*)$ /$1 break;
        proxy_pass http://$demo_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering on;
        proxy_cache off;
        proxy_read_timeout 360s;
        chunked_transfer_encoding on;
    }

    location /assets/ {
        # PERF: fingerprinted (content-hashed) build assets are immutable — cache
        # 1 year in the browser AND at the Cloudflare edge so repeat visits skip
        # the ~475KB JS bundle entirely. (Cloudflare's default Browser Cache TTL
        # was overriding to 4h; an explicit immutable header is respected.)
        expires 1y;
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        # Same Cache-Control + snippet pairing as HTTP SPA / : adding Cache-Control
        # alone would drop inherited security headers on :443.
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name aimeshbackend.zeroshield.ai;
    client_max_body_size 64m;
    include /etc/nginx/edge-error.inc;
    location / {
        resolver 127.0.0.53 ipv6=off valid=30s;
        set $control_upstream "control:8000";
        proxy_pass http://$control_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    location /ws/ {
        resolver 127.0.0.53 ipv6=off valid=30s;
        set $control_upstream "control:8000";
        proxy_pass http://$control_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name aimeshgateway.zeroshield.ai;
    client_max_body_size 64m;
    include /etc/nginx/edge-error.inc;
    include /etc/nginx/deny-public-openapi.inc;

    # Prometheus scrape (gateway enforces METRICS_SCRAPER_KEY)
    location = /metrics {
        resolver 127.0.0.53 ipv6=off valid=30s;
        set $gateway_metrics "gateway:8300";
        proxy_pass http://$gateway_metrics/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Metrics-Scraper-Key $http_x_metrics_scraper_key;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        resolver 127.0.0.53 ipv6=off valid=30s;
        set $gateway_upstream "gateway:8300";
        proxy_pass http://$gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        proxy_cache off;
        proxy_read_timeout 360s;
        chunked_transfer_encoding on;
    }
}

# Unknown Host / direct IP on :443 — do not serve the SPA. Repeat the origin
# cert in this server so default_server does not depend on http{} inheritance.
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    include /etc/nginx/edge-error.inc;
    default_type text/plain;

    location = / {
        include /etc/nginx/security-headers.inc;
        return 200 "ok\n";
    }
    location = /healthz {
        include /etc/nginx/security-headers.inc;
        return 200 "ok\n";
    }
    location = /health {
        include /etc/nginx/security-headers.inc;
        return 200 "ok\n";
    }
    location = /health/ {
        include /etc/nginx/security-headers.inc;
        return 200 "ok\n";
    }
    location = /gw-health {
        include /etc/nginx/security-headers.inc;
        return 200 "ok\n";
    }
    location / {
        return 403;
    }
}
